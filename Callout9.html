  const paintGutter = () => {
    const n = source.value.split('\n').length;
    gutter.textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
  };
  function setSourceMode(on){
    sourceMode = on;
    srcWrap.hidden = !on;
    input.hidden  = on;
    findBar.hidden = true;
    tbBtn.src.classList.toggle('on', on);
    tbBtn.src.setAttribute('aria-pressed', String(on));
    /* every rich-text control is meaningless while raw HTML is on screen */
    for (const el of bar.querySelectorAll('button,select,input,.tb-pick-btn'))
      if (el !== tbBtn.src) el.disabled = on;
    /* undo/redo answer to the history, not to this switch */
    if (!on){ tbBtn.undo.disabled = !canUndo; tbBtn.redo.disabled = !canRedo; }
    roving.refresh();
  }
  function toggleSource(){
    if (!sourceMode){
      source.value = prettyHtml(serializeHtml());
      paintGutter();
      setSourceMode(true);
      source.focus();
    } else {
      loadHtml(source.value);
      setSourceMode(false);
      input.focus();
    }
  }
  /* Tab inserts a real tab instead of leaving the field, the way a code editor behaves */
  source.addEventListener('keydown', e => {
    if (e.key !== 'Tab' || e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();
    const { selectionStart: a, selectionEnd: b, value: v } = source;
    source.value = v.slice(0, a) + '  ' + v.slice(b);
    source.selectionStart = source.selectionEnd = a + 2;
    markDirty(); paintGutter();
  });

  /* ── Links ────────────────────────────────────────── */
  function registerLinks(ed){
    const un = [
      ed.registerCommand(link.TOGGLE_LINK_COMMAND, payload => {
        link.$toggleLink(payload);
        return true;
      }, core.COMMAND_PRIORITY_EDITOR),
      /* Ctrl/⌘ + click opens the target, the way every editor with links behaves */
      ed.registerCommand(core.CLICK_COMMAND, e => {
        if (!(e.ctrlKey || e.metaKey)) return false;
        const a = e.target && e.target.closest && e.target.closest('a[href]');
        if (!a) return false;
        window.open(a.getAttribute('href'), '_blank', 'noopener');
        return true;
      }, core.COMMAND_PRIORITY_LOW),
      /* Typing a bare URL turns it into a link, but only once a space closes the word -
         linkifying mid-word would swallow the characters still being typed. */
      ed.registerNodeTransform(core.TextNode, textNode => {
        if (!textNode.isSimpleText()) return;
        const parent = textNode.getParent();
        if (!parent || link.$isLinkNode(parent) || link.$isAutoLinkNode(parent)) return;
        if (code.$isCodeNode(parent) || textNode.hasFormat('code')) return;
        const text = textNode.getTextContent();
        const m = URL_RE.exec(text);
        if (!m || !/^\s/.test(text.slice(m.index + m[0].length))) return;
        const target = m[0];
        let mid = textNode;
        if (m.index > 0) mid = textNode.splitText(m.index)[1];
        if (mid.getTextContent().length > target.length) mid.splitText(target.length);
        const auto = link.$createAutoLinkNode(target.startsWith('www.') ? 'https://' + target : target);
        mid.replace(auto);
        auto.append(core.$createTextNode(target));
      })
    ];
    return () => un.forEach(f => f());
  }

  /* ── Tables ───────────────────────────────────────── */
  /* applyTableHandlers() is what gives a table drag-select across cells, Tab between
     cells, arrow-key exit and column resizing. It is per table element, so it is wired
     up as tables appear and torn down as they go. */
  function registerTables(ed){
    const live = new Map();
    const un = [
      ed.registerCommand(table.INSERT_TABLE_COMMAND, ({ rows, columns, includeHeaders }) => {
        const t = table.$createTableNodeWithDimensions(+rows, +columns, includeHeaders !== false);
        util.$insertNodeToNearestRoot(t);
        const first = t.getFirstDescendant();
        if (first) first.selectStart();
        return true;
      }, core.COMMAND_PRIORITY_EDITOR),
      ed.registerMutationListener(table.TableNode, muts => {
        const fresh = [];
        for (const [key, kind] of muts){
          if (kind === 'destroyed'){ live.get(key)?.(); live.delete(key); continue; }
          if (!live.has(key)) fresh.push(key);
        }
        if (!fresh.length) return;
        /* the node handle is read inside the editor state, the wiring happens outside it */
        const found = [];
        ed.getEditorState().read(() => {
          for (const key of fresh){
            const n = core.$getNodeByKey(key), el = ed.getElementByKey(key);
            if (n && el) found.push([key, n, el]);
          }
        });
        for (const [key, n, el] of found){
          try {
            const obs = table.applyTableHandlers(n, el, ed, true);
            live.set(key, () => { try { obs.removeListeners(); } catch(_){} });
          } catch(err){ console.warn('table handlers could not be attached', err); }
        }
      })
    ];
    return () => { un.forEach(f => f()); live.forEach(f => f()); live.clear(); };
  }
  const tableOp = fn => editor.update(() => {
    const s = core.$getSelection();
    if (!core.$isRangeSelection(s) && !table.$isTableSelection(s)) return;
    try { fn(); } catch(err){ toast('That does not work outside a table.', true); }
  });

  /* ── Checklist ────────────────────────────────────── */
  /* registerList() handles bullets and numbers; the check variant and the click-to-tick
     behaviour are the part the bundle leaves to the host. */
  function registerChecklist(ed){
    const un = [
      ed.registerCommand(list.INSERT_CHECK_LIST_COMMAND, () => {
        list.insertList(ed, 'check');
        return true;
      }, core.COMMAND_PRIORITY_LOW),
      ed.registerCommand(core.CLICK_COMMAND, e => {
        const li = e.target && e.target.closest && e.target.closest('li.li-o, li.li-x');
        if (!li) return false;
        /* only the marker toggles; clicking the label should place the caret */
        if (e.clientX > li.getBoundingClientRect().left) return false;
        const n = core.$getNearestNodeFromDOMNode(li);
        if (!list.$isListItemNode(n)) return false;
        n.toggleChecked();
        return true;
      }, core.COMMAND_PRIORITY_LOW)
    ];
    return () => un.forEach(f => f());
  }

  /* ── Tab indents, Shift+Tab outdents ──────────────── */
  function registerTabIndent(ed){
    return ed.registerCommand(core.KEY_TAB_COMMAND, e => {
      const s = core.$getSelection();
      if (!core.$isRangeSelection(s)) return false;
      /* inside a table Tab moves to the next cell - that handler runs first */
      if (util.$findMatchingParent(s.anchor.getNode(), n => table.$isTableCellNode(n))) return false;
      e.preventDefault();
      ed.dispatchCommand(e.shiftKey ? core.OUTDENT_CONTENT_COMMAND : core.INDENT_CONTENT_COMMAND, undefined);
      return true;
    }, core.COMMAND_PRIORITY_LOW);
  }

  /* ── Markdown shortcuts ───────────────────────────── */
  /* "# " turns the line into a heading, "- " into a bullet, "> " into a quote and so on -
     the typing rhythm anyone who writes markdown expects. Runs on the space that closes
     the marker, and Ctrl+Z right after puts the literal text back. */
  const BLOCK_SHORTCUTS = [
    [/^(#{1,6})$/,        (m, ed) => blockAt(() => rich.$createHeadingNode('h' + m[1].length))],
    [/^>$/,               ()      => blockAt(() => rich.$createQuoteNode())],
    [/^[-*+]$/,           (m, ed) => ed.dispatchCommand(list.INSERT_UNORDERED_LIST_COMMAND, undefined)],
    [/^\[[ xX]?\]$/,      (m, ed) => ed.dispatchCommand(list.INSERT_CHECK_LIST_COMMAND, undefined)],
    [/^\d{1,9}[.)]$/,     (m, ed) => ed.dispatchCommand(list.INSERT_ORDERED_LIST_COMMAND, undefined)]
  ];
  function registerMarkdownShortcuts(ed){
    const un = [
      ed.registerCommand(core.KEY_SPACE_COMMAND, () => {
        const s = core.$getSelection();
        if (!core.$isRangeSelection(s) || !s.isCollapsed()) return false;
        const n = s.anchor.getNode();
        if (!core.$isTextNode(n) || n.getIndexWithinParent() !== 0) return false;
        const block = n.getParent();
        if (!block || !core.$isParagraphNode(block)) return false;
        const head = n.getTextContent().slice(0, s.anchor.offset);
        for (const [re, run] of BLOCK_SHORTCUTS){
          const m = re.exec(head);
          if (!m) continue;
          n.spliceText(0, head.length, '', true);      // the marker itself is consumed
          run(m, ed);
          return true;
        }
        return false;
      }, core.COMMAND_PRIORITY_LOW),
      /* "```" or "---" on a line of its own, closed with Enter */
      ed.registerCommand(core.KEY_ENTER_COMMAND, e => {
        const s = core.$getSelection();
        if (!core.$isRangeSelection(s) || !s.isCollapsed()) return false;
        const block = s.anchor.getNode().getTopLevelElement();
        if (!block || !core.$isParagraphNode(block)) return false;
        const text = block.getTextContent();
        const fence = /^(`{3,}|~{3,})([A-Za-z0-9_+#-]*)$/.exec(text);
        if (fence){
          if (e) e.preventDefault();
          const c = code.$createCodeNode(fence[2] || undefined);
          block.replace(c);
          c.selectStart();
          return true;
        }
        if (/^(-{3,}|\*{3,}|_{3,})$/.test(text)){
          if (e) e.preventDefault();
          const hr = $createHorizontalRuleNode(), p = core.$createParagraphNode();
          block.replace(hr);
          hr.insertAfter(p);            // the caret carries on below the rule, not at the end
          p.selectStart();
          return true;
        }
        return false;
      }, core.COMMAND_PRIORITY_LOW)
    ];
    return () => un.forEach(f => f());
  }

  /* ── Paste without formatting (Ctrl/⌘ + Shift + V) ── */
  function registerPlainPaste(ed){
    return ed.registerCommand(core.PASTE_COMMAND, e => {
      if (!plainPasteArmed) return false;
      plainPasteArmed = false;
      const text = e.clipboardData && e.clipboardData.getData('text/plain');
      if (text == null) return false;
      e.preventDefault();
      ed.update(() => {
        const s = core.$getSelection();
        if (core.$isRangeSelection(s)) s.insertRawText(text);
      });
      return true;
    }, core.COMMAND_PRIORITY_CRITICAL);
  }
  let plainPasteArmed = false, armT = 0;
  input.addEventListener('keydown', e => {
    if (!((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'v')) return;
    plainPasteArmed = true;
    /* if the paste never arrives (the OS swallowed it, the clipboard was empty) the arming
       must not sit there and turn the next ordinary Ctrl+V into a plain one */
    clearTimeout(armT);
    armT = setTimeout(() => { plainPasteArmed = false; }, 1000);
  });

  /* ── Split below the caret's line ───────────────────
     The line the caret is on stays here whole; everything below it leaves this editor and
     is handed to onSplit(), which keeps it in a new sibling node. */
  const NOTHING_AFTER = 'There is nothing below this line to split off.';
  /* Parked between the two halves: it marks the boundary in the serialized HTML, and it
     also keeps the halves from growing back together — the list plugin merges two lists
     that end up side by side, which would undo the split of a list. */
  const MARK = '⁣__SPLIT__⁣';
  const topLevel = src => {
    const doc = new DOMParser().parseFromString(src || '', 'text/html');
    return [...doc.body.children].map(el => el.outerHTML);
  };
  /* Where the tail begins, as (element, child index): right after the caret's line. A line
     ends at the next line break inside its block, and a block with no break left in it is a
     line of its own — then the cut moves up, out of every block it sits at the end of. */
  function lineEnd(point){
    let block, from;
    if (point.type === 'text'){
      /* climb out of any inline wrapper (a link), so the block holding the breaks is found */
      let child = point.getNode(), p = child.getParent();
      while (p && core.$isElementNode(p) && p.isInline()){ child = p; p = child.getParent(); }
      block = p; from = child.getIndexWithinParent() + 1;
    } else {
      block = point.getNode(); from = point.offset;
    }
    if (!block) return { parent:null, index:0, block:null };
    if (core.$isRootOrShadowRoot(block)) return { parent:block, index:from, block };

    const kids = block.getChildren();
    let index = kids.length;                          // no break below: the block is the line
    for (let i = from; i < kids.length; i++)
      if (core.$isLineBreakNode(kids[i])){ index = i + 1; break; }

    let parent = block;
    while (parent && !core.$isRootOrShadowRoot(parent) && index >= parent.getChildrenSize()){
      index = parent.getIndexWithinParent() + 1;
      parent = parent.getParent();
    }
    return { parent, index, block };
  }
  /* The table cell (or any other shadow root) the caret sits in, if any. A cell cannot be
     cut in half and left in two nodes, so a caret inside one splits below the whole table. */
  function shadowHost(n){
    for (let p = n; p; p = p.getParent())
      if (core.$isRootOrShadowRoot(p) && p.getParent()) return p;
    return null;
  }
  /* The top-level block a node belongs to. getTopLevelElement() stops at the nearest
     shadow root, which inside a table is the cell or the row rather than the table. */
  function topBlock(n){
    const rootKey = core.$getRoot().getKey();
    let cur = n;
    while (cur && cur.getParent() && cur.getParent().getKey() !== rootKey) cur = cur.getParent();
    return cur && cur.getParent() ? cur : null;
  }
  /* → { tail } with the HTML below the caret's line, or { err } with the reason it did not
       run. The editor keeps that line and everything above it. */
  function splitAtCaret(){
    if (sourceMode) return { err:'Leave the HTML source view before splitting.' };
    let err = null, markKey = null;
    /* discrete, so the split is committed before the serializing read below */
    editor.update(() => {
      const s = core.$getSelection();
      if (!core.$isRangeSelection(s)){ err = 'Put the caret where the text should be split.'; return; }
      const root = core.$getRoot();
      const point = s.isBackward() ? s.focus : s.anchor;    // a selection splits at its start
      let tailIndex;
      const cell = shadowHost(point.getNode());
      if (cell){                                           // in a table: the table stays here
        const top = topBlock(cell);
        if (!top){ err = 'Could not work out where to split.'; return; }
        tailIndex = top.getIndexWithinParent() + 1;
        if (tailIndex >= root.getChildrenSize()){ err = NOTHING_AFTER; return; }
      } else {
        const { parent, index, block } = lineEnd(point);
        if (!parent){ err = 'Could not work out where to split.'; return; }
        if (parent.getKey() === root.getKey()){            // the cut falls between two blocks
          if (index >= root.getChildrenSize()){ err = NOTHING_AFTER; return; }
          tailIndex = index;
        } else {
          /* splits the line's block, and every block around it, up to the top level */
          tailIndex = core.$splitNode(parent, index)[1].getIndexWithinParent();
          if (parent.getKey() === block.getKey()){
            /* the break that closed the line is the last thing in the head now — drop it */
            const last = block.getLastChild();
            if (last && core.$isLineBreakNode(last)) last.remove();
          }
        }
      }
      const tailTop = root.getChildAtIndex(tailIndex);
      if (!tailTop){ err = NOTHING_AFTER; return; }
      const mark = core.$createParagraphNode();
      mark.append(core.$createTextNode(MARK));
      tailTop.insertBefore(mark);
      markKey = mark.getKey();
    }, { discrete:true });
    if (err) return { err };
    if (!markKey) return { err:'Could not work out where to split.' };

    /* Serialized in one piece, then cut at the marker: whatever follows it is the tail. */
    const full = topLevel(serializeHtml());
    const at = full.findIndex(s => s.includes(MARK));
    editor.update(() => {
      const mark = core.$getNodeByKey(markKey);
      if (!mark) return;
      const root = core.$getRoot();
      const rest = root.getChildren().slice(mark.getIndexWithinParent());
      (at < 0 ? [mark] : rest).forEach(n => n.remove());    // the marker, and the tail with it
      if (root.getChildrenSize() === 0) root.append(core.$createParagraphNode());
      root.selectEnd();
    }, { discrete:true });
    if (at < 0) return { err:'Could not split the text.' };
    input.focus();
    return { tail: full.slice(at + 1).join('\n') };
  }
  function runSplit(){
    const r = splitAtCaret();
    if (r.err){ toast(r.err, true); return; }
    onSplit?.(r.tail);
  }

  /* ── Commands the toolbar drives ──────────────────── */
  const blockAt = factory => editor.update(() => {
    const s = core.$getSelection();
    if (core.$isRangeSelection(s)) sel.$setBlocksType(s, factory);
  });
  const fmt = f => { editor.dispatchCommand(core.FORMAT_TEXT_COMMAND, f); input.focus(); };
  const align = a => { editor.dispatchCommand(core.FORMAT_ELEMENT_COMMAND, a); input.focus(); };
  const cmd = (c, arg) => { editor.dispatchCommand(c, arg); input.focus(); };
  /* Quote is a toggle: pressing it inside a quote drops back to a plain paragraph,
     the same way the list picker turns a list off again. */
  const inQuote = () => {
    const s = core.$getSelection();
    return core.$isRangeSelection(s) && rich.$isQuoteNode(s.anchor.getNode().getTopLevelElement());
  };
  const inCode = () => {
    const s = core.$getSelection();
    return core.$isRangeSelection(s) && code.$isCodeNode(s.anchor.getNode().getTopLevelElement());
  };
  function toggleQuote(){
    let on = false;
    editor.getEditorState().read(() => { on = inQuote(); });
    blockAt(() => on ? core.$createParagraphNode() : rich.$createQuoteNode());
    input.focus();
  }
  function toggleCodeBlock(){
    let on = false;
    editor.getEditorState().read(() => { on = inCode(); });
    blockAt(() => on ? core.$createParagraphNode() : code.$createCodeNode());
    input.focus();
  }
  /* Strips every character format, the inline colour/font styles and the block type in
     one go - the ✕ button used to clear only the two colours. */
  function clearFormatting(){
    editor.update(() => {
      const s = core.$getSelection();
      if (!core.$isRangeSelection(s)) return;
      for (const f of ['bold','italic','underline','strikethrough','code','subscript','superscript','highlight'])
        if (s.hasFormat(f)) s.formatText(f);
      sel.$patchStyleText(s, Object.fromEntries(STYLE_PROPS.map(p => [p, null])));
      for (const n of s.getNodes()){
        if (core.$isTextNode(n)){ n.setFormat(0); n.setStyle(''); }
        const l = util.$findMatchingParent(n, p => link.$isLinkNode(p) || link.$isAutoLinkNode(p));
        if (l){ const kids = l.getChildren(); kids.forEach(k => l.insertBefore(k)); l.remove(); }
      }
    });
    /* a list or a quote is a block format too, so the block type goes back to Body */
    editor.dispatchCommand(list.REMOVE_LIST_COMMAND, undefined);
    blockAt(() => core.$createParagraphNode());
    input.focus();
  }

  /* ── Link editing popover ─────────────────────────── */
  const pop = document.createElement('div');
  pop.className = 'link-pop'; pop.hidden = true;
  const popIn = document.createElement('input');
  popIn.type = 'url'; popIn.placeholder = 'https://…'; popIn.spellcheck = false;
  popIn.setAttribute('aria-label', 'Link target');
  const popOk = document.createElement('button');
  popOk.className = 't-btn'; popOk.type = 'button'; popOk.textContent = '✓'; popOk.title = 'Apply';
  const popDel = document.createElement('button');
  popDel.className = 't-btn'; popDel.type = 'button'; popDel.innerHTML = ICON.unlink; popDel.title = 'Remove link';
  pop.append(popIn, popOk, popDel);
  holder.appendChild(pop);

  let popRange = null;                              // the selection the popover is editing
  function currentLink(){
    let href = null;
    editor.getEditorState().read(() => {
      const s = core.$getSelection();
      if (!core.$isRangeSelection(s)) return;
      const l = util.$findMatchingParent(s.anchor.getNode(), n => link.$isLinkNode(n) || link.$isAutoLinkNode(n));
      if (l) href = l.getURL();
    });
    return href;
  }
  function openLinkPop(){
    if (sourceMode) return;
    let empty = true;
    editor.getEditorState().read(() => {
      const s = core.$getSelection();
      empty = !core.$isRangeSelection(s) || (s.isCollapsed() && !currentLink());
    });
    if (empty){ toast('Select the text to turn into a link first.', true); return; }
    popRange = editor.getEditorState().read(() => {
      const s = core.$getSelection();
      return core.$isRangeSelection(s) ? s.clone() : null;
    });
    popIn.value = currentLink() || '';
    const r = window.getSelection();
    const box = r && r.rangeCount ? r.getRangeAt(0).getBoundingClientRect() : null;
    const host = holder.getBoundingClientRect();
    pop.hidden = false;
    pop.style.top  = ((box ? box.bottom - host.top : 60) + 6) + 'px';
    pop.style.left = Math.max(6, Math.min((box ? box.left - host.left : 20),
                                          holder.clientWidth - pop.offsetWidth - 6)) + 'px';
    popIn.focus(); popIn.select();
  }
  function applyLink(url){
    editor.update(() => {
      if (popRange) core.$setSelection(popRange.clone());
      editor.dispatchCommand(link.TOGGLE_LINK_COMMAND, url);
    });
    pop.hidden = true; input.focus();
  }
  popOk.addEventListener('click', () => {
    const v = popIn.value.trim();
    if (!v){ toast('Enter a link target.', true); return; }
    applyLink(/^[a-z][\w+.-]*:|^[#/]/i.test(v) ? v : 'https://' + v);
  });
  popDel.addEventListener('click', () => applyLink(null));
  popIn.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); popOk.click(); }
    if (e.key === 'Escape'){ e.preventDefault(); pop.hidden = true; input.focus(); }
  });
  pop.addEventListener('mousedown', e => { if (e.target !== popIn) e.preventDefault(); });

  /* ── Find and replace ─────────────────────────────── */
  /* Works on the rendered text of the editable area: the hits are painted with the browser's
     own highlight ranges, and a replace re-runs through Lexical so it lands in the undo
     history like any other edit. */
  const findBar = document.createElement('div');
  findBar.className = 'find-bar'; findBar.hidden = true;
  findBar.innerHTML =
    '<input class="q" placeholder="Find" aria-label="Find">' +
    '<span class="hits">0/0</span>' +
    '<button class="btn sm" data-go="-1" title="Previous (Shift+Enter)">↑</button>' +
    '<button class="btn sm" data-go="1" title="Next (Enter)">↓</button>' +
    '<input class="r" placeholder="Replace with" aria-label="Replace with">' +
    '<button class="btn sm" data-act="one">Replace</button>' +
    '<button class="btn sm" data-act="all">All</button>' +
    '<label><input type="checkbox" class="cs">Aa</label>' +
    '<button class="btn sm" data-act="close" title="Close (Esc)">✕</button>';
  holder.insertBefore(findBar, holder.firstChild);
  const fq = findBar.querySelector('.q'), fr = findBar.querySelector('.r'),
        fcs = findBar.querySelector('.cs'), fhits = findBar.querySelector('.hits');
  let hits = [], hitAt = -1;

  /* Every text node in the editable area, with the running offset of its first character */
  function textRuns(){
    const runs = [];
    const walk = document.createTreeWalker(input, NodeFilter.SHOW_TEXT);
    let at = 0;
    for (let n = walk.nextNode(); n; n = walk.nextNode()){
      runs.push({ node:n, at, len:n.nodeValue.length });
      at += n.nodeValue.length;
    }
    return { runs, text: runs.map(r => r.node.nodeValue).join('') };
  }
  function runFind(keepAt){
    const q = fq.value;
    hits = [];
    if (q){
      const { runs, text } = textRuns();
      const hay = fcs.checked ? text : text.toLowerCase();
      const needle = fcs.checked ? q : q.toLowerCase();
      for (let i = hay.indexOf(needle); i >= 0; i = hay.indexOf(needle, i + needle.length))
        hits.push({ start:i, end:i + needle.length, runs });
    }
    hitAt = hits.length ? Math.min(keepAt === true ? Math.max(hitAt, 0) : 0, hits.length - 1) : -1;
    paintHits();
  }
  function rangeFor(hit){
    const pick = off => {
      const r = hit.runs.find(x => off >= x.at && off <= x.at + x.len);
      return r ? [r.node, off - r.at] : null;
    };
    const a = pick(hit.start), b = pick(hit.end);
    if (!a || !b) return null;
    const r = document.createRange();
    r.setStart(a[0], a[1]); r.setEnd(b[0], b[1]);
    return r;
  }
  /* CSS Custom Highlight where the browser has it, and a plain selection otherwise */
  const HL = window.Highlight && CSS.highlights ? new Highlight() : null;
  if (HL) CSS.highlights.set('c9-find', HL);
  function paintHits(){
    if (HL) HL.clear();
    fhits.textContent = (hits.length ? hitAt + 1 : 0) + '/' + hits.length;
    if (!hits.length) return;
    if (HL) for (const h of hits){ const r = rangeFor(h); if (r) HL.add(r); }
    const cur = rangeFor(hits[hitAt]);
    if (!cur) return;
    const s = window.getSelection();
    s.removeAllRanges(); s.addRange(cur);
    const el = cur.startContainer.parentElement;
    if (el && el.scrollIntoView) el.scrollIntoView({ block:'nearest' });
  }
  function step(d){
    if (!hits.length) return;
    hitAt = (hitAt + d + hits.length) % hits.length;
    paintHits();
  }
  function replaceOne(){
    if (hitAt < 0 || !hits[hitAt]) return;
    const r = rangeFor(hits[hitAt]);
    if (!r) return;
    const s = window.getSelection();
    s.removeAllRanges(); s.addRange(r);
    input.focus();
    editor.update(() => {
      const lex = core.$getSelection();
      if (core.$isRangeSelection(lex)) lex.insertText(fr.value);
    });
    setTimeout(() => runFind(true), 0);
  }
  /* Done inside the editor state rather than over DOM ranges: one undo step, and no stale
     node handles. A hit that straddles two runs (half of it bold, say) is left for
     Replace, which works off the live selection. */
  function replaceAll(){
    const q = fq.value;
    if (!q) return;
    const cs = fcs.checked;
    const needle = cs ? q : q.toLowerCase();
    let n = 0;
    editor.update(() => {
      for (const tn of core.$nodesOfType(core.TextNode)){
        if (!tn.isSimpleText()) continue;
        const t = tn.getTextContent();
        const hay = cs ? t : t.toLowerCase();
        if (!hay.includes(needle)) continue;
        let out = '', i = 0;
        for (let k = hay.indexOf(needle); k >= 0; k = hay.indexOf(needle, k + needle.length)){
          out += t.slice(i, k) + fr.value; i = k + needle.length; n++;
        }
        tn.setTextContent(out + t.slice(i));
      }
    }, { discrete:true });
    toast(n ? 'Replaced ' + n + '.' : 'Nothing to replace.', !n);
    setTimeout(() => runFind(), 0);
  }
  function openFind(on){
    if (on && sourceMode){ toast('Leave the HTML source view to search.', true); return; }
    findBar.hidden = !on;
    tbBtn.find.classList.toggle('on', on);
    tbBtn.find.setAttribute('aria-pressed', String(on));
    if (on){ fq.focus(); fq.select(); runFind(); }
    else { if (HL) HL.clear(); hits = []; input.focus(); }
  }
  fq.addEventListener('input', () => runFind());
  fcs.addEventListener('change', () => runFind());
  fq.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); step(e.shiftKey ? -1 : 1); }
    if (e.key === 'Escape'){ e.preventDefault(); openFind(false); }
  });
  fr.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); replaceOne(); }
    if (e.key === 'Escape'){ e.preventDefault(); openFind(false); }
  });
  findBar.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.go) step(+b.dataset.go);
    else if (b.dataset.act === 'one') replaceOne();
    else if (b.dataset.act === 'all') replaceAll();
    else if (b.dataset.act === 'close') openFind(false);
  });

  /* ── Table size picker ────────────────────────────── */
  function askTable(){
    const spec = prompt('Table size — rows x columns', '3x3');
    if (spec == null) return;
    const m = /^\s*(\d{1,2})\s*[x*,\s]\s*(\d{1,2})\s*$/i.exec(spec);
    if (!m){ toast('Enter the size as rows x columns, for example 3x4.', true); return; }
    const [rows, cols] = [+m[1], +m[2]];
    if (rows < 1 || cols < 1 || rows > 50 || cols > 20){
      toast('Between 1x1 and 50x20, please.', true); return;
    }
    cmd(table.INSERT_TABLE_COMMAND, { rows, columns: cols, includeHeaders: true });
  }

  /* ── Toolbar ──────────────────────────────────────── */
  /* Block type picker. A node body sits below the node's own heading in the generated
     document, so H1-H3 are rarely what a body wants - they are offered all the same, and
     shiftHeadings() moves the whole body under the node's heading level on export. */
  const blockSel = document.createElement('select');
  blockSel.className = 'tb-select';
  blockSel.title = 'Block type';
  blockSel.setAttribute('aria-label', 'Block type');
  for (const [value, text] of [['p','Body'], ['h1','H1'], ['h2','H2'], ['h3','H3'],
                               ['h4','H4'], ['h5','H5'], ['h6','H6'],
                               ['quote','Quote'], ['code','Code']]){
    const o = document.createElement('option');
    o.value = value; o.textContent = text; blockSel.appendChild(o);
  }
  blockSel.addEventListener('change', () => {
    const v = blockSel.value;
    if (v === 'quote'){ blockAt(() => rich.$createQuoteNode()); }
    else if (v === 'code'){ blockAt(() => code.$createCodeNode()); }
    else blockAt(() => v === 'p' ? core.$createParagraphNode() : rich.$createHeadingNode(v));
    input.focus();
  });

  const listPick = iconSelect('List type', LIST_ITEMS, value => {
    const cmdFor = { ul: list.INSERT_UNORDERED_LIST_COMMAND,
                     ol: list.INSERT_ORDERED_LIST_COMMAND,
                     check: list.INSERT_CHECK_LIST_COMMAND }[value] || list.REMOVE_LIST_COMMAND;
    cmd(cmdFor, undefined);
  });
  const alignPick = iconSelect('Text alignment', ALIGN_ITEMS, align);
  const fontPick = iconSelect('Font', FONTS.map(f => ({
    value: f.value, label: f.label, style: f.value ? 'font-family:' + f.value : ''
  })), v => { style({ 'font-family': v || null }); input.focus(); }, { wide:true });
  const sizePick = iconSelect('Font size', SIZES.map(s => ({
    value: s, label: s || 'Default'
  })), v => { style({ 'font-size': v || null }); input.focus(); });

  /* Font / highlight colour. Applies to the selection, or to whatever is typed next
     when the caret is collapsed. */
  const style = props => editor.update(() => {
    const s = core.$getSelection();
    if (core.$isRangeSelection(s)) sel.$patchStyleText(s, props);
  });
  function colorPicker(glyph, prop, fallback, title){
    const wrap = document.createElement('label');
    wrap.className = 'tb-color'; wrap.title = title;
    const ico = document.createElement('span'); ico.textContent = glyph;
    const swatch = document.createElement('span'); swatch.className = 'swatch';
    swatch.style.background = fallback;
    const inp = document.createElement('input'); inp.type = 'color'; inp.value = fallback;
    inp.setAttribute('aria-label', title);
    wrap.append(ico, swatch, inp);
    /* live swatch feedback while the OS picker is open, commit once it closes */
    inp.addEventListener('input', () => { swatch.style.background = inp.value; });
    inp.addEventListener('change', () => { style({ [prop]: inp.value }); input.focus(); });
    return {
      el: wrap,
      sync(value){
        swatch.style.background = value || fallback;
        const hex = toHex(value);
        if (hex) inp.value = hex;
      }
    };
  }
  const fgPick = colorPicker('A', 'color', '#182220', 'Font color');
  const bgPick = colorPicker('▨', 'background-color', '#ffe58a', 'Highlight color');

  const grp = els => { const g = document.createElement('div'); g.className = 'tb-grp'; els.forEach(e => g.appendChild(e)); return g; };
  buildToolbar(bar, [
    [ICON.undo, () => cmd(core.UNDO_COMMAND, undefined), withKey('Undo', MOD + '+Z')],
    [ICON.redo, () => cmd(core.REDO_COMMAND, undefined), withKey('Redo', MOD + '+Shift+Z')],
    ['|', null],
    blockSel,
    fontPick.el,
    sizePick.el,
    ['|', null],
    ['<b>B</b>', () => fmt('bold'), withKey('Bold', MOD + '+B'), { toggle:true }],
    ['<i>I</i>', () => fmt('italic'), withKey('Italic', MOD + '+I'), { toggle:true }],
    ['<u>U</u>', () => fmt('underline'), withKey('Underline', MOD + '+U'), { toggle:true }],
    ['<s>S</s>', () => fmt('strikethrough'), 'Strikethrough', { toggle:true }],
    ['X<sup>2</sup>', () => fmt('superscript'), 'Superscript', { toggle:true }],
    ['X<sub>2</sub>', () => fmt('subscript'), 'Subscript', { toggle:true }],
    ['&lt;/&gt;', () => fmt('code'), 'Inline code', { toggle:true }],
    ['|', null],
    fgPick.el,
    bgPick.el,
    [ICON.clear, clearFormatting, 'Clear all formatting'],
    ['|', null],
    listPick.el,
    alignPick.el,
    [ICON.outdent, () => cmd(core.OUTDENT_CONTENT_COMMAND, undefined), withKey('Outdent', 'Shift+Tab')],
    [ICON.indent, () => cmd(core.INDENT_CONTENT_COMMAND, undefined), withKey('Indent', 'Tab')],
    ['❝', toggleQuote, 'Quote', { toggle:true, label:'Quote' }],
    [ICON.codeblk, toggleCodeBlock, 'Code block', { toggle:true }],
    ['|', null],
    [ICON.link, openLinkPop, withKey('Link', MOD + '+K')],
    [ICON.table, askTable, 'Insert table'],
    [ICON.hr, () => editor.update(() => {
       const s = core.$getSelection();
       if (core.$isRangeSelection(s)) util.$insertNodeToNearestRoot($createHorizontalRuleNode());
       input.focus();
     }), 'Horizontal rule'],
    ['|', null],
    [ICON.find, () => openFind(findBar.hidden), withKey('Find and replace', MOD + '+F'), { toggle:true }],
    [ICON.split, runSplit, 'Split below this line — the rest becomes the next node'],
    ['HTML', toggleSource, 'View HTML source', { toggle:true }]
  ]);
  const byTitle = t => bar.querySelector('.tb[title^="' + t + '"]');
  const tbBtn = {
    bold: byTitle('Bold'), italic: byTitle('Italic'), underline: byTitle('Underline'),
    strike: byTitle('Strikethrough'), sup: byTitle('Superscript'), sub: byTitle('Subscript'),
    code: byTitle('Inline code'), quote: byTitle('Quote'), codeblk: byTitle('Code block'),
    link: byTitle('Link'), find: byTitle('Find'), src: byTitle('View HTML source'),
    undo: byTitle('Undo'), redo: byTitle('Redo')
  };

  const tail = document.createElement('div');
  tail.className = 'tb-tail';
  const counter = document.createElement('span');
  counter.className = 'tb-count';
  tail.append(counter, toolbarNote('Lexical · edit as HTML → save as MD'));
  bar.appendChild(tail);
  const roving = rovingToolbar(bar);

  /* ── Keeping the toolbar in step with the caret ───── */
  const setOn = (btn, on) => {
    if (!btn) return;
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', String(!!on));
  };
  function syncToolbar(){
    editor.getEditorState().read(() => {
      const s = core.$getSelection();
      if (!core.$isRangeSelection(s)) return;
      const top = s.anchor.getNode().getTopLevelElement();
      const tag = top && rich.$isHeadingNode(top) ? top.getTag()
                : top && rich.$isQuoteNode(top)   ? 'quote'
                : top && code.$isCodeNode(top)    ? 'code' : 'p';
      blockSel.value = [...blockSel.options].some(o => o.value === tag) ? tag : 'p';

      const ln = util.$getNearestNodeOfType(s.anchor.getNode(), list.ListNode);
      const lt = ln && ln.getListType();
      listPick.set(lt === 'number' ? 'ol' : lt === 'bullet' ? 'ul' : lt === 'check' ? 'check' : '');

      const el = top && core.$isElementNode(top) ? top : null;
      alignPick.set(el ? (['', 'left', 'center', 'right', 'justify'][el.getFormat()] || 'left') : 'left');

      fgPick.sync(sel.$getSelectionStyleValueForProperty(s, 'color', ''));
      bgPick.sync(sel.$getSelectionStyleValueForProperty(s, 'background-color', ''));
      const fam = sel.$getSelectionStyleValueForProperty(s, 'font-family', '');
      fontPick.set(FONTS.some(f => f.value === fam) ? fam : '');
      const sz = sel.$getSelectionStyleValueForProperty(s, 'font-size', '');
      sizePick.set(SIZES.includes(sz) ? sz : '');

      /* every character format now lights up, not just the two that were easy to miss */
      setOn(tbBtn.bold, s.hasFormat('bold'));
      setOn(tbBtn.italic, s.hasFormat('italic'));
      setOn(tbBtn.underline, s.hasFormat('underline'));
      setOn(tbBtn.strike, s.hasFormat('strikethrough'));
      setOn(tbBtn.sup, s.hasFormat('superscript'));
      setOn(tbBtn.sub, s.hasFormat('subscript'));
      setOn(tbBtn.code, s.hasFormat('code'));
      setOn(tbBtn.quote, tag === 'quote');
      setOn(tbBtn.codeblk, tag === 'code');
      setOn(tbBtn.link, !!util.$findMatchingParent(s.anchor.getNode(),
        n => link.$isLinkNode(n) || link.$isAutoLinkNode(n)));
    });
  }
  /* Words and characters, from the plain text of the document */
  function syncCount(){
    let text = '';
    editor.getEditorState().read(() => { text = core.$getRoot().getTextContent(); });
    const words = (text.match(/[^\s]+/g) || []).length;
    counter.textContent = words + 'w · ' + text.length + 'c';
    counter.title = words + ' words, ' + text.length + ' characters';
  }
  /* One rAF per burst: the toolbar sync used to run on every keystroke's update, which is
     the wrong amount of work for a long document. Counting walks the whole document, so
     it waits for a pause in the typing instead. */
  let pending = 0, countT = 0;
  const scheduleSync = () => {
    if (!pending) pending = requestAnimationFrame(() => { pending = 0; syncToolbar(); });
    clearTimeout(countT);
    countT = setTimeout(syncCount, 400);
  };
  off.push(editor.registerUpdateListener(scheduleSync));
  off.push(editor.registerCommand(core.SELECTION_CHANGE_COMMAND, () => { scheduleSync(); return false; },
                                  core.COMMAND_PRIORITY_LOW));
  let canUndo = false, canRedo = false;
  off.push(editor.registerCommand(core.CAN_UNDO_COMMAND, can => {
    canUndo = can; if (!sourceMode) tbBtn.undo.disabled = !can;
    return false;
  }, core.COMMAND_PRIORITY_CRITICAL));
  off.push(editor.registerCommand(core.CAN_REDO_COMMAND, can => {
    canRedo = can; if (!sourceMode) tbBtn.redo.disabled = !can;
    return false;
  }, core.COMMAND_PRIORITY_CRITICAL));
  tbBtn.undo.disabled = tbBtn.redo.disabled = true;
  syncToolbar(); syncCount();

  /* Shortcuts the browser does not hand to Lexical on its own */
  function onKey(e){
    if (!(e.ctrlKey || e.metaKey)) return;
    const k = e.key.toLowerCase();
    if (k === 'k'){ e.preventDefault(); openLinkPop(); }
    else if (k === 'f'){ e.preventDefault(); openFind(true); }
    else if (k === 'h'){ e.preventDefault(); openFind(true); fr.focus(); }
    else if (k === '\\'){ e.preventDefault(); clearFormatting(); }
  }
  shell.addEventListener('keydown', onKey);
  shell.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !findBar.hidden){ e.preventDefault(); openFind(false); }
  });

  const getHtml = () => sourceMode ? source.value : serializeHtml();
  return {
    getHtml,
    getMarkdown: () => htmlToMd(getHtml()),
    focus: () => input.focus(),
    destroy(){
      if (pending) cancelAnimationFrame(pending);
      clearTimeout(countT);
      if (HL) HL.clear();
      listPick.close(); alignPick.close(); fontPick.close(); sizePick.close();
      off.forEach(f => { try { f(); } catch(_){} });
      editor.setRootElement(null);
    }
  };
}

/* ══════════════════════════════════════════════════════════
   7. AI calls
   ══════════════════════════════════════════════════════════ */
/* The dialog runs in two modes:
   'text'  - the AI writes the manual body, saved as a Text node (the ✦ button)
   'image' - the AI re-draws the same picture with red number labels taken from the
             description just written, saved as an Image node. */
const LABEL_PROMPT =
  'Recreate the image by marking the locations indicated by each number in the attached description with red number labels.';
const ASK_UI = {
  text : { h:'Generate with AI', busy:'AI is writing the content…',
           hint:'The image and the note are sent together, and the result is saved as a <b>Text</b> node under this one.' },
  image: { h:'Label the image with AI', busy:'AI is drawing the image…',
           hint:'The image, the note and the description just generated are sent together, and the image that comes back ' +
                'is saved as an <b>Image</b> node under this one. The model must be able to return images.' }
};
/* Kept per mode so an edited note / model survives closing and reopening the dialog.
   The notes also go to storage, so the last one sent comes back on the next run. */
const askMemos  = { text: $('#askMemo').value, image: LABEL_PROMPT };
const askModels = { text: '', image: '' };
const saveMemos = () => store.set(K_MEMOS, JSON.stringify(askMemos));

/* Models offered in the dialog. `image` marks the ones that can draw a picture rather
   than only read one - the labeling step is unusable without such a model. Whatever is
   registered under “Register AI API” is added to the list too, so a model typed there
   by hand can still be picked here. */
const MODEL_CATALOG = {
  gemini:    [{ id:'gemini-3.6-flash' }, { id:'gemini-3.6-pro' }, { id:'gemini-2.5-flash-image', image:true }],
  openai:    [{ id:'gpt-4o' }, { id:'gpt-4o-mini' }, { id:'gpt-image-1', image:true }],
  anthropic: [{ id:'claude-sonnet-4-6' }]
};
const DRAWS = /image|dall-e/i;
function modelChoices(mode){
  const cat = MODEL_CATALOG[config.provider] || [];
  const ids = cat.map(m => m.id);
  for (const extra of [config.model, config.imageModel])
    if (extra && !ids.includes(extra)) ids.push(extra);
  if (mode !== 'image') return ids;
  const draws = ids.filter(id => cat.find(m => m.id === id)?.image || DRAWS.test(id));
  return draws.length ? draws : ids;      // nothing suitable: show all, the call reports why
}
function paintAskModels(mode){
  const sel = $('#askModel');
  const ids = modelChoices(mode);
  sel.innerHTML = '';
  for (const id of ids){
    const o = document.createElement('option');
    o.value = id; o.textContent = id;
    sel.appendChild(o);
  }
  /* last pick if it is still on offer, otherwise the registered default for this mode */
  const want = [askModels[mode],
                mode === 'image' ? (config.imageModel || DEF_IMAGE_MODEL[config.provider]) : config.model]
               .find(v => v && ids.includes(v));
  sel.value = want || ids[0] || '';
  sel.disabled = !ids.length;
}

let askTarget = null, askMode = 'text', askDesc = '';

function paintAsk(){
  $('#askH').textContent   = ASK_UI[askMode].h;
  $('#askHint').innerHTML  = ASK_UI[askMode].hint;
  $('#askMemo').value      = askMemos[askMode];
  paintAskModels(askMode);
}
function showAsk(node, mode, desc){
  askTarget = node; askMode = mode; askDesc = desc || '';
  $('#askThumb').src = node.image;
  $('#askFrom').textContent = node.name;
  paintAsk();
  $('#askScrim').hidden = false;
  const memo = $('#askMemo'); memo.focus(); memo.select();
}
function openAsk(node){
  if (!aiReady()){ toast(AI_NOT_REGISTERED, true); openApi(); return; }
  /* Commit any in-progress image edit first so the AI receives the latest image */
  if (currentEditor && currentEditor.node === node && state.dirty) currentEditor.save(true);
  showAsk(node, 'text');
}
/* Offered right after a description is generated: re-draw the same image with the
   numbers from that description marked on it. */
function openLabelAsk(node, markdown){
  if (!aiReady()){ toast(AI_NOT_REGISTERED, true); openApi(); return; }
  showAsk(node, 'image', markdown);
}
$('#askSend').addEventListener('click', runAsk);
$('#askMemo').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runAsk();
});

async function runAsk(){
  const node = askTarget, mode = askMode, desc = askDesc;
  const memo = $('#askMemo').value.trim();
  if (!node) return;
  if (!memo){ toast('Enter a note to send to the AI.', true); $('#askMemo').focus(); return; }
  if (!aiReady()){
    toast(AI_NOT_REGISTERED, true);
    $('#askScrim').hidden = true; openApi(); return;
  }
  const model = $('#askModel').value;
  askMemos[mode] = memo;
  askModels[mode] = model;
  saveMemos();
  $('#askScrim').hidden = true;
  const busy = currentEditor?.busy, fab = currentEditor?.fab;
  if (busy){
    const label = busy.querySelector('span');
    if (label) label.textContent = ASK_UI[mode].busy;
    busy.hidden = false;
  }
  if (fab) fab.hidden = true;

  /* The follow-up prompt has to wait until the busy overlay is down, so it is only
     recorded here and asked after the finally block. */
  let labelFrom = null;
  try {
    if (mode === 'image'){
      const { dataUrl, mime } = await callAIImage(node, memo, desc, model);
      const child = {
        id: uid(), type:'image', name:'Image' + (++state.imageSeq),
        image: dataUrl, mime, memo, children: []
      };
      (node.children ||= []).push(child);
      node.collapsed = false;
      save();
      state.selectedId = child.id; tree.render(); renderEditor();
      toast(`Created node ${child.name}.`);
    } else {
      const markdown = await callAI(node, memo, model);
      const html = mdToHtml(markdown);
      /* Named after the first line that has any text in it, cut to SPLIT_TITLE_MAX */
      const child = {
        id: uid(), type:'text', name: splitTitle(html) || ('Text' + (++state.textSeq)),
        markdown, html, memo, children: []
      };
      node.children.push(child);
      node.collapsed = false;
      save();
      state.selectedId = child.id; tree.render(); renderEditor();
      toast(`Created node ${child.name}.`);
      labelFrom = markdown;
    }
  } catch(err){
    console.error(err);
    toast((mode === 'image' ? 'Labeling failed: ' : 'Generation failed: ') + err.message, true);
  } finally {
    if (busy) busy.hidden = true;
    if (fab) fab.hidden = false;
  }

  if (labelFrom && confirm('Would you like to label the images based on the text?'))
    openLabelAsk(node, labelFrom);
}

function splitDataURL(dataUrl){
  const m = /^data:([^;,]+);base64,(.*)$/s.exec(dataUrl);
  if (!m) throw new Error('Unrecognized image format.');
  return { mime: m[1], b64: m[2] };
}
function stripFence(t){
  const s = t.trim();
  const m = /^```(?:markdown|md)?\s*\n([\s\S]*?)\n?```$/.exec(s);
  return (m ? m[1] : s).trim();
}

/* `pick` is the model chosen in the dialog; without one the registered default is used
   (the connection test calls this with no pick). */
async function callAI(node, memo, pick){
  const { mime, b64 } = splitDataURL(node.image);
  const sys = config.system || DEFAULT_SYSTEM;
  const p = config.provider;

  if (p === 'anthropic'){
    const headers = {
      'Content-Type':'application/json',
      'x-api-key': config.apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    };
    const res = await fetch(apiBase(p), {
      method:'POST', headers,
      body: JSON.stringify({
        model: pick || config.model || DEF_MODEL.anthropic,
        max_tokens: 4096,
        system: sys,
        messages: [{ role:'user', content:[
          { type:'image', source:{ type:'base64', media_type: mime, data: b64 } },
          { type:'text', text: memo }
        ]}]
      })
    });
    const data = await parseRes(res);
    return stripFence((data.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n'));
  }

  if (p === 'gemini'){
    const model = pick || config.model || DEF_MODEL.gemini;
    const url = geminiURL(model);
    const res = await fetch(url, {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        systemInstruction:{ parts:[{ text: sys }] },
        contents:[{ role:'user', parts:[ { inline_data:{ mime_type: mime, data: b64 } }, { text: memo } ] }]
      })
    });
    const data = await parseRes(res);
    const parts = data.candidates?.[0]?.content?.parts || [];
    return stripFence(parts.map(x => x.text || '').join('\n'));
  }

  // openai
  const base = apiBase(p);
  if (!base) throw new Error('Base URL is empty.');
  const res = await fetch(base + '/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + config.apiKey },
    body: JSON.stringify({
      model: pick || config.model || 'gpt-4o-mini',
      max_tokens: 4096,
      messages:[
        { role:'system', content: sys },
        { role:'user', content:[
          { type:'image_url', image_url:{ url: node.image } },
          { type:'text', text: memo }
        ]}
      ]
    })
  });
  const data = await parseRes(res);
  return stripFence(data.choices?.[0]?.message?.content || '');
}

/* ── Image answers ──────────────────────────────────
   Providers hand an image back in a different shape each (Anthropic image blocks,
   Gemini inline_data, OpenAI b64_json, OpenAI-compatible servers a data: URL inside
   the message). Rather than one branch per shape, the whole JSON is scanned for the
   first base64 image that is not the picture we sent. */
const IMAGE_SYSTEM =
  'You edit images. Return the edited image itself as your answer; do not reply with text only.';
const B64_RE = /^[A-Za-z0-9+/=\s]+$/;

function imageFromText(t){
  const m = /data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=]+/i.exec(t || '');
  if (!m) return null;
  return { dataUrl: m[0], mime: /^data:([^;]+)/.exec(m[0])[1] };
}
function findImage(v, skipB64, depth = 0){
  if (v == null || depth > 8) return null;
  if (typeof v === 'string') return imageFromText(v);
  if (Array.isArray(v)){
    for (const x of v){ const r = findImage(x, skipB64, depth + 1); if (r) return r; }
    return null;
  }
  if (typeof v !== 'object') return null;

  const raw = v.b64_json || v.base64 || (typeof v.data === 'string' ? v.data : null);
  if (raw && raw.length > 512 && B64_RE.test(raw)){
    const b64 = raw.replace(/\s+/g, '');
    if (b64 !== skipB64){                       // ignore the image we sent, echoed back
      const t = v.mime_type || v.mimeType || v.media_type || v.mediaType || v.type;
      const mime = (typeof t === 'string' && t.startsWith('image/')) ? t : 'image/png';
      return { dataUrl: `data:${mime};base64,${b64}`, mime };
    }
  }
  for (const k of Object.keys(v)){ const r = findImage(v[k], skipB64, depth + 1); if (r) return r; }
  return null;
}
function dataUrlToBlob(dataUrl){
  const { mime, b64 } = splitDataURL(dataUrl);
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new Blob([buf], { type: mime });
}

/* Sends the image plus the note and the description, and returns the picture that
   comes back. Throws when the answer holds no image. */
async function callAIImage(node, memo, desc, pick){
  const p = config.provider;
  if (!IMAGE_CAPABLE(p))
    throw new Error('Anthropic cannot return images. Register Gemini or OpenAI under “Register AI API” and pick an image model.');

  const { mime, b64 } = splitDataURL(node.image);
  const prompt = desc ? `${memo}\n\n--- Description ---\n${desc}` : memo;
  logPrompt('image', p, pick || config.imageModel || config.model, IMAGE_SYSTEM, prompt);
  /* The labeling step uses its own model - the one that writes the manual usually reads
     images but cannot draw them. */
  const model = pick || config.imageModel || DEF_IMAGE_MODEL[p] || config.model || '';
  let data, text = '';

  if (p === 'gemini'){
    const url = geminiURL(model);
    const body = {
      contents:[{ role:'user', parts:[ { inline_data:{ mime_type: mime, data: b64 } }, { text: prompt } ] }],
      generationConfig: { responseModalities:['TEXT','IMAGE'] }
    };
    const res = await fetch(url, {
      method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body)
    });
    data = await parseRes(res);
    text = (data.candidates?.[0]?.content?.parts || []).map(x => x.text || '').join('\n');

  } else {
    const base = apiBase(p);
    if (!base) throw new Error('Base URL is empty.');
    if (/gpt-image|dall-e/i.test(model)){
      /* A dedicated image model takes the picture as multipart form data, not JSON */
      const fd = new FormData();
      fd.append('model', model);
      fd.append('prompt', prompt);
      fd.append('image', dataUrlToBlob(node.image), 'image.png');
      const res = await fetch(base + '/images/edits', {
        method:'POST', headers:{ 'Authorization':'Bearer ' + config.apiKey }, body: fd
      });
      data = await parseRes(res);
    } else {
      const res = await fetch(base + '/chat/completions', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + config.apiKey },
        body: JSON.stringify({
          model: model || 'gpt-4o-mini',
          max_tokens: 4096,
          messages:[
            { role:'system', content: IMAGE_SYSTEM },
            { role:'user', content:[
              { type:'image_url', image_url:{ url: node.image } },
              { type:'text', text: prompt }
            ]}
          ]
        })
      });
      data = await parseRes(res);
      const c = data.choices?.[0]?.message?.content;
      text = typeof c === 'string' ? c : '';
    }
  }

  const img = findImage(data, b64);
  if (!img){
    const reply = text.trim().replace(/\s+/g, ' ').slice(0, 140);
    throw new Error(`“${model}” answered without an image — pick a model that can draw ` +
      `(e.g. gemini-2.5-flash-image, gpt-image-1) in the AI model box.` +
      (reply ? ` Its reply: ${reply}` : ''));
  }
  return img;
}

async function parseRes(res){
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch(_){}
  if (!res.ok){
    const msg = data?.error?.message || data?.message || text.slice(0,180) || res.statusText;
    throw new Error(`${res.status} ${msg}`);
  }
  if (!data) throw new Error('Could not parse the response.');
  return data;
}

/* Shifts the heading levels inside a text node's body to match its tree depth
   (level 1 node -> H1, level 2 -> H2 …). Relative heading structure is preserved. */
function shiftHeadings(md, level){
  const src = (md || '').replace(/\r\n?/g, '\n');
  if (!src.trim()) return '';
  const lines = src.split('\n');

  let fence = false, min = 7;
  for (const l of lines){
    if (/^\s*```/.test(l)){ fence = !fence; continue; }
    if (fence) continue;
    const m = /^(#{1,6})\s+\S/.exec(l);
    if (m) min = Math.min(min, m[1].length);
  }
  if (min === 7) return src.trim();            // no headings, leave it as is

  const delta = level - min;
  if (!delta) return src.trim();

  fence = false;
  return lines.map(l => {
    if (/^\s*```/.test(l)){ fence = !fence; return l; }
    if (fence) return l;
    const m = /^(#{1,6})(\s+.*)$/.exec(l);
    if (!m) return l;
    return '#'.repeat(Math.min(6, Math.max(1, m[1].length + delta))) + m[2];
  }).join('\n').trim();
}

function buildMarkdown(){
  const out = [];                              // only tree content is emitted (no document title)
  const rec = (list, depth) => {
    for (const n of list){
      const level = Math.min(depth + 1, 6);     // level 1 node -> H1, level 2 -> H2 …
      const name = (n.name || '').trim();
      if (n.type === 'image'){
        // an image node contributes the picture only - its name stays as alt text
        out.push(`![${name}](${n.image})`, '');
      } else {
        if (name) out.push(`${'#'.repeat(level)} ${name}`, '');   // a text node name becomes a heading
        // push body headings one more level down so they nest under the node heading
        const body = shiftHeadings(n.markdown, Math.min(level + 1, 6));
        if (body) out.push(body, '');
      }
      if (n.children?.length) rec(n.children, depth + 1);
    }
  };
  rec(state.nodes, 0);
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

/* ══════════════════════════════════════════════════════════
   9b. Open — an existing MD / AsciiDoc file becomes a tree
   ══════════════════════════════════════════════════════════
   H1-H3 become the tree nodes (nested by their level), the text under a heading is
   kept in that node, and every image in it is added below it as an image node.
   Deeper headings (H4-H6) stay inside the body, where shiftHeadings() puts them
   back at the right level on export. */
const ADOC_EXT = /\.(adoc|asciidoc|asc|ad)$/i;
const DOC_EXT  = /\.(md|markdown|mdown|mkd|txt|adoc|asciidoc|asc|ad)$/i;
const NAME_MAX = 60;

/* ── AsciiDoc → Markdown ────────────────────────────
   Only the subset a manual actually uses: headings, lists, images, links, tables,
   verbatim / quote blocks and the inline marks. Anything else is carried over as text. */
const adocAlt = at => (String(at || '').split(',')[0] || '').replace(/^["']|["']$/g, '').trim();
function adocInline(s){
  const code = [];
  /* monospace runs are parked first, so no rule below rewrites what is inside them */
  let t = s.replace(/`([^`]+)`/g, (_, c) => { code.push(c); return '\u0001' + (code.length - 1) + '\u0001'; });
  t = t
    .replace(/image:([^\s\[]+)\[([^\]]*)\]/g, (_, src, at) => `![${adocAlt(at)}](${src})`)
    .replace(/(?:link|xref):([^\s\[]+)\[([^\]]*)\]/g, (_, url, txt) => `[${txt || url}](${url})`)
    .replace(/(^|[\s(])(https?:\/\/[^\s\[\]]+)\[([^\]]*)\]/g, (_, p, url, txt) => `${p}[${txt || url}](${url})`)
    .replace(/\*\*([^*]+)\*\*|\*([^*\n]+)\*/g, (_, a, b) => `**${a ?? b}**`)
    .replace(/__([^_]+)__/g, '*$1*')
    .replace(/(^|[\s(])_([^_\n]+)_/g, '$1*$2*');
  return t.replace(/\u0001(\d+)\u0001/g, (_, i) => '`' + code[+i] + '`');
}
/* cols="1,1,2" / cols=3* → how many columns the table has */
function adocCols(attr){
  const m = /cols\s*=\s*"?([^"\]]+)"?/.exec(attr || '');
  if (!m) return 0;
  const v = m[1].trim();
  const rep = /^(\d+)\s*\*/.exec(v);
  return rep ? +rep[1] : v.split(',').length;
}
function adocToMd(src){
  const lines = (src || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let fence = null;      // delimiter that opened the verbatim block we are inside
  let quote = false;     // inside a ____ quote block
  let cells = null, cols = 0, attr = null;

  const flushTable = () => {
    if (!cells) return;
    const n = cols || 1;
    const rows = [];
    for (let i = 0; i < cells.length; i += n) rows.push(cells.slice(i, i + n));
    if (rows.length){
      const head = rows[0];
      while (head.length < n) head.push('');
      out.push('| ' + head.map(c => c || ' ').join(' | ') + ' |',
               '|' + head.map(() => ' --- ').join('|') + '|');
      rows.slice(1).forEach(r => {
        while (r.length < n) r.push('');
        out.push('| ' + r.map(c => c || ' ').join(' | ') + ' |');
      });
      out.push('');
    }
    cells = null; cols = 0;
  };

  for (const raw of lines){
    const l = raw.trimEnd();

    if (fence){                                        // verbatim: only the closing line matters
      if (l.trim() === fence){ out.push('```'); fence = null; }
      else out.push(raw);
      continue;
    }
    if (cells){                                        // inside |=== … |===
      if (/^\|===/.test(l)){ flushTable(); continue; }
      if (!l.trim()) continue;
      if (/^\|/.test(l)){
        const row = l.replace(/^\|/, '').split(/\s+\|/).map(c => adocInline(c.trim()));
        if (!cols) cols = row.length;
        cells.push(...row);
      }
      continue;
    }

    const dl = /^(-{4,}|\.{4,}|`{3,}|\+{4,}|_{4,}|\*{4,}|={4,})\s*$/.exec(l);
    if (dl){
      const d = dl[1];
      if (/^[-.`+]/.test(d)){ out.push('```'); fence = d; }        // listing / literal / source
      else if (d[0] === '_'){ quote = !quote; out.push(''); }      // quote block
      /* ==== and **** only wrap other content — the delimiters themselves are dropped */
      attr = null; continue;
    }
    if (/^\/\//.test(l)) continue;                                 // comment
    if (/^:[^:\s][^:]*:/.test(l)) continue;                        // document attribute
    if (/^\[[^\]]*\]\s*$/.test(l)){ attr = l; continue; }          // block attribute list
    if (/^\|===/.test(l)){ cells = []; cols = adocCols(attr); attr = null; continue; }
    if (!l.trim()){ out.push(''); continue; }

    const h = /^(={1,6})\s+(.*)$/.exec(l);
    if (h){ out.push('#'.repeat(h[1].length) + ' ' + adocInline(h[2].trim()), ''); attr = null; continue; }

    const bi = /^image::([^\s\[]+)\[([^\]]*)\]\s*$/.exec(l);
    if (bi){ out.push(`![${adocAlt(bi[2])}](${bi[1]})`, ''); attr = null; continue; }

    const pre = quote ? '> ' : '';
    let m = /^(\*{1,5})\s+(.*)$/.exec(l);                          // bullet list
    if (m){ out.push(pre + '  '.repeat(m[1].length - 1) + '- ' + adocInline(m[2])); continue; }
    m = /^(\.{1,5})\s+(.*)$/.exec(l);                              // numbered list
    if (m){ out.push(pre + '  '.repeat(m[1].length - 1) + '1. ' + adocInline(m[2])); continue; }
    m = /^-\s+(.*)$/.exec(l);
    if (m){ out.push(pre + '- ' + adocInline(m[1])); continue; }
    m = /^([^\s:][^\n]*?)::(\s+.*)?$/.exec(l);                     // labeled list
    if (m){ out.push(pre + '- **' + adocInline(m[1].trim()) + '**' +
                     (m[2] && m[2].trim() ? ': ' + adocInline(m[2].trim()) : '')); continue; }
    m = /^(NOTE|TIP|IMPORTANT|WARNING|CAUTION):\s*(.*)$/.exec(l);  // admonition
    if (m){ out.push(`> **${m[1]}:** ` + adocInline(m[2])); continue; }
    m = /^\.(\S.*)$/.exec(l);                                      // block title
    if (m){ out.push(pre + '**' + adocInline(m[1].trim()) + '**'); continue; }

    out.push(pre + adocInline(l).replace(/ \+$/, '  '));           // ' +' is a hard line break
  }
  flushTable();
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

/* ── Markdown → nodes ───────────────────────────── */
/* A heading is a node name, so the inline markers around it are dropped */
function headingText(s){
  return (s || '')
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/~~([^~]+)~~/g, '$1')
    .replace(/\s+/g, ' ').trim().slice(0, NAME_MAX).trimEnd();
}
/* one space before an inline picture goes with it, so pulling it out of a sentence
   does not leave a double space behind */
const IMG_RE = /[ \t]?!\[([^\]]*)\]\(\s*<?([^)\s>]+)>?(?:\s+["'(][^)]*)?\s*\)/g;
/* The pictures leave the body and become image nodes, so they are not written twice */
function extractImages(md){
  const imgs = [];
  const text = (md || '').replace(IMG_RE, (_, alt, src) => { imgs.push({ alt, src }); return ''; });
  return { text: text.replace(/[ \t]+$/gm, '').replace(/\n{3,}/g, '\n\n').trim(), imgs };
}
/* → { roots, made, pre }: the tree, one { node, lines } per heading in reading order,
     and whatever came before the first heading. */
function mdToNodes(md, seq){
  const lines = (md || '').replace(/\r\n?/g, '\n').split('\n');
  const roots = [], made = [], pre = [], stack = [];
  let cur = null, fence = false;

  for (const l of lines){
    if (/^\s*(```|~~~)/.test(l)) fence = !fence;
    const h = fence ? null : /^(#{1,3})\s+(.+?)\s*#*\s*$/.exec(l);
    if (!h){ (cur ? cur.lines : pre).push(l); continue; }

    const level = h[1].length;
    const node = { id: uid(), type:'text', name: headingText(h[2]) || ('Text' + (++seq.text)),
                   markdown:'', html:'', children: [] };
    while (stack.length && stack[stack.length - 1].level >= level) stack.pop();
    const parent = stack.length ? stack[stack.length - 1].node : null;
    (parent ? parent.children : roots).push(node);
    stack.push({ level, node });
    cur = { node, lines: [] };
    made.push(cur);
  }
  return { roots, made, pre };
}

/* ── Resolving the images a document points at ──────
   A data: URL is already the picture. A relative path is matched, by file name, against
   the image files picked alongside the document; an http(s) one is fetched when the
   server allows it. Anything left unresolved keeps its original path, so the node still
   exports the same reference it came in with. */
const IMG_MIME = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif',
                   webp:'image/webp', svg:'image/svg+xml', bmp:'image/bmp', avif:'image/avif' };
function guessMime(src){
  const d = /^data:([^;,]+)/i.exec(src || '');
  if (d) return d[1];
  const e = /\.([a-z0-9]+)(?:[?#]|$)/i.exec(src || '');
  return IMG_MIME[(e ? e[1] : '').toLowerCase()] || 'image/png';
}
/* a hand-written path may hold a stray % that decodeURIComponent refuses */
const unesc = s => { try { return decodeURIComponent(s); } catch(_){ return s; } };
const baseName = p => unesc(String(p || '')).split(/[?#]/)[0].split(/[\\/]/).pop().toLowerCase();
async function resolveImgSrc(src, assets){
  if (/^data:/i.test(src)) return src;
  const f = assets.get(baseName(src));
  if (f){ try { return await fileToDataURL(f); } catch(_){} }
  if (/^https?:\/\//i.test(src)){
    try {
      const r = await fetch(src);
      if (r.ok) return await fileToDataURL(await r.blob());
    } catch(_){}
  }
  return null;
}

async function openDocument(doc, assets){
  const md = ADOC_EXT.test(doc.name) ? adocToMd(await doc.text()) : await doc.text();
  const seq = { text: 0, image: 0 };            // names for anything the file left unnamed
  const { roots, made, pre } = mdToNodes(md, seq);

  /* Above the first heading: real text gets a node of its own, but a document that
     merely opens with a picture keeps that picture as a top-level image node — there is
     no text for a text node to hold. A null node means "hang the images off the root". */
  const lead = pre.join('\n');
  if (extractImages(lead).text){
    const node = { id: uid(), type:'text', name:'', markdown:'', html:'', children: [] };
    roots.unshift(node);
    made.unshift({ node, lines: pre });
  } else if (lead.trim()){
    made.unshift({ node: null, lines: pre });
  }
  if (!made.length){ toast('The file has no headings or text to import.', true); return; }

  let images = 0, unresolved = 0;
  for (const s of made){
    const { text, imgs } = extractImages(s.lines.join('\n'));
    if (s.node){
      s.node.markdown = text;
      s.node.html = mdToHtml(text);
      if (!s.node.name) s.node.name = splitTitle(s.node.html) || ('Text' + (++seq.text));
    }
    const pics = [];
    for (const im of imgs){
      const src = await resolveImgSrc(im.src, assets);
      if (!src) unresolved++;
      images++;
      pics.push({
        id: uid(), type:'image',
        name: headingText(im.alt) || ('Image' + (++seq.image)),
        image: src || im.src, mime: guessMime(src || im.src), children: []
      });
    }
    /* the sub-sections are already in children; the pictures belong to this
       node's own text, so they go in front of them */
    (s.node ? s.node.children : roots).unshift(...pics);
  }

  clearProject();
  state.textSeq = seq.text; state.imageSeq = seq.image;   // keep the counters the names above used
  state.title = doc.name.replace(/\.[^.]+$/, '') || 'Manual';
  state.nodes = roots;
  tree.render();
  if (roots.length) selectNode(roots[0].id); else renderEditor();
  save();
  toast(`Opened ${doc.name} · ${made.filter(s => s.node).length} text node(s), ${images} image(s)` +
        (unresolved ? ` · ${unresolved} image file(s) could not be found — pick them together with the document.` : '.'),
        !!unresolved);
}

$('#btnOpen').addEventListener('click', () => {
  if (tree.countNodes() &&
      !confirm('Everything in the current document will be replaced by the file you open. Continue?')) return;
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.md,.markdown,.mdown,.mkd,.adoc,.asciidoc,.asc,.ad,.txt,text/markdown,image/*';
  /* the images a document refers to by a relative path can be picked along with it */
  inp.multiple = true;
  inp.onchange = async () => {
    const files = [...inp.files];
    if (!files.length) return;
    const doc = files.find(f => DOC_EXT.test(f.name)) ||
                files.find(f => !f.type.startsWith('image/'));
    if (!doc){ toast('Select a Markdown (.md) or AsciiDoc (.adoc) file.', true); return; }
    const assets = new Map();
    for (const f of files) if (f !== doc) assets.set(f.name.toLowerCase(), f);
    try { await openDocument(doc, assets); pushTreeUndo(); }
    catch(err){ console.error(err); toast('Could not open the file: ' + err.message, true); }
  };
  inp.click();
});

$('#btnBuild').addEventListener('click', () => {
  flushEditor();
  if (!state.nodes.length){ toast('There are no nodes to export.', true); return; }
  const md = buildMarkdown();
  const blob = new Blob([md], { type:'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (state.title || 'Manual').replace(/[\\/:*?"<>|]/g,'_') + '.md';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('MD file downloaded. Images are embedded in the file.');
});

/* ══════════════════════════════════════════════════════════
   10. Autosave / restore
   ══════════════════════════════════════════════════════════ */
let saveT = null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    const payload = JSON.stringify({
      title: state.title, imageSeq: state.imageSeq, textSeq: state.textSeq, nodes: state.nodes
    });
    if (payload.length > 4_500_000){ console.warn('Autosave skipped: payload too large'); return; }
    await store.set(K_PROJECT, payload);
  }, 700);
}

async function restore(){
  try {
    const raw = await store.get(K_CONFIG);
    if (raw){
      const saved = JSON.parse(raw);
      /* Configs written before the checkbox existed always carried the key, so a stored
         key with no flag means the user had opted into keeping it. */
      if (saved.saveKey === undefined) saved.saveKey = !!saved.apiKey;
      if (!saved.saveKey) saved.apiKey = '';
      /* The list once held 'builtin' and 'compatible'; a config written back then falls
         through to the closest provider still on offer. */
      if (saved.provider === 'builtin'){ saved.provider = 'anthropic'; saved.baseUrl = ''; }
      else if (saved.provider === 'compatible') saved.provider = 'openai';
      if (!DEF_BASE[saved.provider]) saved.provider = 'gemini';
      config = Object.assign(config, saved);
    }
  } catch(_){}
  paintApiState();
  /* Notes typed into the AI dialog on an earlier run */
  try {
    const raw = await store.get(K_MEMOS);
    if (raw){
      const saved = JSON.parse(raw);
      for (const k of Object.keys(askMemos))
        if (typeof saved[k] === 'string' && saved[k].trim()) askMemos[k] = saved[k];
    }
  } catch(_){}
  try {
    const raw = await store.get(K_PROJECT);
    if (raw){
      const p = JSON.parse(raw);
      state.nodes = p.nodes || [];
      state.imageSeq = p.imageSeq || 0;
      state.textSeq = p.textSeq || 0;
    }
  } catch(_){}
}

window.addEventListener('beforeunload', e => {
  if (state.dirty){ e.preventDefault(); e.returnValue = ''; }
});

/* ══════════════════════════════════════════════════════════
   11. Splitter (drag the bar between the tree and the editor)
   ══════════════════════════════════════════════════════════ */
const SIDE_MIN = 220;   // tree side never gets narrower than this
const MAIN_MIN = 420;   // editor never gets narrower than this
const SIDE_DEFAULT = 316;
const K_SIDEW = 'manualgen:sidew';

const splitter = $('#splitter'), sideEl = document.querySelector('.side'),
      mainEl   = document.querySelector('.main'), bodyEl = document.querySelector('.body');

/* Clamp so neither pane goes under its minimum, and apply. */
function setSideWidth(px, maxW){
  const max = maxW != null ? maxW : sideMax();
  const w   = Math.round(Math.min(Math.max(px, SIDE_MIN), max));
  document.documentElement.style.setProperty('--side-w', w + 'px');
  return w;
}

/* Widest the side may get before the editor hits MAIN_MIN.
   gaps = the two flex gaps + the splitter, i.e. whatever isn't one of the panes. */
function sideMax(){
  const total = bodyEl.clientWidth;
  const gaps  = total - sideEl.offsetWidth - mainEl.offsetWidth;
  return Math.max(SIDE_MIN, total - gaps - MAIN_MIN);
}

/* Drag state is measured once on pointerdown: reading offsetWidth on every
   pointermove forces a sync layout and makes the bar lag behind the cursor. */
let dragging = false, dragStartX = 0, dragStartW = 0, dragMax = 0, dragX = 0, dragRaf = 0;

splitter.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  dragging   = true;
  dragStartX = dragX = e.clientX;   // seed dragX so a click with no move keeps the width
  dragStartW = sideEl.offsetWidth;
  dragMax    = sideMax();
  splitter.setPointerCapture(e.pointerId);
  splitter.classList.add('dragging');
  document.body.classList.add('col-resizing');
  e.preventDefault();
});

splitter.addEventListener('pointermove', e => {
  if (!dragging) return;
  dragX = e.clientX;
  if (dragRaf) return;                                  // coalesce to one paint per frame
  dragRaf = requestAnimationFrame(() => {
    dragRaf = 0;
    setSideWidth(dragStartW + (dragX - dragStartX), dragMax);   // 1:1 with the pointer
  });
});

function endDrag(e){
  if (!dragging) return;
  dragging = false;
  if (dragRaf){ cancelAnimationFrame(dragRaf); dragRaf = 0; }
  setSideWidth(dragStartW + (dragX - dragStartX), dragMax);     // land on the last position
  try { splitter.releasePointerCapture(e.pointerId); } catch(_){}
  splitter.classList.remove('dragging');
  document.body.classList.remove('col-resizing');
  store.set(K_SIDEW, String(sideEl.offsetWidth));
}
splitter.addEventListener('pointerup', endDrag);
splitter.addEventListener('pointercancel', endDrag);

/* Double-click resets, arrow keys nudge (the bar is focusable). */
splitter.addEventListener('dblclick', () => {
  store.set(K_SIDEW, String(setSideWidth(SIDE_DEFAULT)));
});
splitter.addEventListener('keydown', e => {
  const step = e.shiftKey ? 40 : 12;
  if (e.key === 'ArrowLeft')       store.set(K_SIDEW, String(setSideWidth(sideEl.offsetWidth - step)));
  else if (e.key === 'ArrowRight') store.set(K_SIDEW, String(setSideWidth(sideEl.offsetWidth + step)));
  else return;
  e.preventDefault();
});

/* Keep the panes legal when the window shrinks. */
window.addEventListener('resize', () => { if (window.innerWidth > 760) setSideWidth(sideEl.offsetWidth); });

async function restoreSideWidth(){
  try {
    const raw = await store.get(K_SIDEW);
    if (raw) setSideWidth(parseInt(raw, 10) || SIDE_DEFAULT);
  } catch(_){}
}

/* ══════════════════════════════════════════════════════════
   12. Startup
   ══════════════════════════════════════════════════════════ */
(async function init(){
  await restore();
  resetTreeUndo();          // the restored document is the baseline, not an empty tree
  await restoreSideWidth();
  loadLexical();
  tree.render();
  renderEditor();
  if (!LEX_OK) toast('Could not load the editor bundle (vendor/lexical.bundle.js).', true);
})();
</script>
