<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callout9</title>


<style>
:root{
  --paper:#eceeed;
  --panel:#ffffff;
  --line:#d5dbd8;
  --line-soft:#e6eae8;
  --ink:#182220;
  --muted:#6c7873;
  --accent:#0d6b5f;
  --accent-ink:#0a4f46;
  --accent-soft:#e2f0ec;
  --danger:#a8432a;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"D2Coding",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --r:7px;
  --side-w:316px;      /* tree side width - dragged by the splitter */
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- shell ---------- */
.app{height:100vh;display:flex;flex-direction:column;gap:8px;padding:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}

.topbar{
  display:flex;align-items:center;gap:14px;padding:0 14px;height:48px;flex:0 0 auto;
}
.brand{font-weight:650;letter-spacing:-.01em;font-size:15px}
.brand em{font-style:normal;color:var(--accent);font-family:var(--mono);font-size:12px;
  border:1px solid var(--accent-soft);background:var(--accent-soft);padding:1px 6px;border-radius:20px;margin-left:8px;vertical-align:2px}
/* opens help.html in its own window */
.help{border:1px solid var(--line);background:#fff;border-radius:50%;width:23px;height:23px;padding:0;
  display:grid;place-items:center;font-size:13px;font-weight:600;line-height:1;color:var(--muted);
  margin-left:-6px;transition:background .12s,border-color .12s,color .12s}
.help:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.help:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.body{flex:1 1 auto;display:flex;gap:2px;min-height:0}
.side{width:var(--side-w);flex:0 0 auto;display:flex;flex-direction:column;gap:8px;min-height:0}

/* ---------- splitter (drag to resize tree / editor) ---------- */
.splitter{
  flex:0 0 7px;align-self:stretch;position:relative;cursor:col-resize;border-radius:4px;
  background:transparent;transition:background .12s;touch-action:none
}
.splitter::before{
  content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:3px;height:38px;border-radius:2px;background:var(--line);transition:background .12s
}
.splitter:hover,.splitter.dragging{background:var(--accent-soft)}
.splitter:hover::before,.splitter.dragging::before{background:var(--accent)}
body.col-resizing{cursor:col-resize;user-select:none}
body.col-resizing *{user-select:none!important}

/* ---------- side: generate ---------- */
/* wraps to a second row rather than overflowing when the side panel is dragged narrow */
.gen{padding:10px;display:flex;flex-wrap:wrap;gap:6px}
.gen .btn{padding:7px 4px;font-size:13px}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:5px;padding:7px 10px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  transition:background .12s,border-color .12s,color .12s;
}
.btn:hover{background:#f6f8f7;border-color:#c3ccc8}
.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.wide{flex:1}
.btn.sm{padding:5px 9px;font-size:13px}
/* Looks disabled but still takes clicks, so we can say why it is unavailable */
.btn.off,.btn.off:hover{background:#e9edec;border-color:#dde3e1;color:#5f6b67;
  box-shadow:none;cursor:not-allowed}

/* ---------- side: tree ---------- */
.tree-panel{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.pane-head{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line-soft);
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)
}
.pane-head{gap:0}
.pane-head .count{margin-left:auto;padding-left:6px;font-variant-numeric:tabular-nums}
/* Tree internals (rows, branches, DnD) styles are injected by tree-view.js */

/* tree toolbar */
.pane-tools{display:flex;align-items:center;gap:2px}
.t-sep{width:1px;align-self:stretch;margin:3px 3px;background:var(--line-soft)}
.t-btn{border:1px solid var(--line);background:#fff;border-radius:4px;width:30px;height:30px;padding:0;
  display:grid;place-items:center;font-family:var(--sans);font-size:13px;line-height:1;color:var(--muted)}
.t-btn:hover:not(:disabled){background:#f2f5f4;border-color:#c3ccc8;color:var(--accent-ink)}
.t-btn:disabled{opacity:.35;cursor:not-allowed}
.t-btn svg{display:block}

/* ---------- side: api ---------- */
.api{padding:10px}
.api .btn{width:100%}
.api-state{display:block;margin-top:7px;font-family:var(--mono);font-size:10.5px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.api-state.off{color:var(--danger)}

/* ---------- editor ---------- */
.main{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
.ed-head{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line-soft);min-height:42px}
.ed-title{font-family:var(--mono);font-size:12.5px;font-weight:600}
.ed-kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 7px}
.ed-actions{margin-left:auto;display:flex;align-items:center;gap:7px}
.dirty{font-family:var(--mono);font-size:11px;color:var(--danger)}
.dirty.saved{color:var(--muted)}
.ed-body{flex:1 1 auto;min-height:0;position:relative;overflow:auto}

.blank{height:100%;display:grid;place-content:center;justify-items:center;gap:10px;color:var(--muted);text-align:center;padding:24px}
.blank .big{font-size:15px;color:var(--ink);font-weight:600}
.blank kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:4px;padding:2px 7px;background:#f7f9f8;color:var(--ink)}
/* the workflow drawing under the empty-state copy — capped by height so a short
   window shrinks it instead of pushing the text out of view */
.blank img{width:100%;max-width:620px;max-height:46vh;height:auto;object-fit:contain;margin-top:60px}

/* image view — the editor is filled in by image-editor.js */
.imgwrap{position:relative;height:100%;display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* lexical editor / HTML source textarea */
.lex-toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line-soft);
  position:sticky;top:0;background:#fff;z-index:2}
.tb{border:1px solid transparent;background:none;border-radius:4px;padding:4px 8px;font-size:12.5px;color:var(--muted);
  font-family:var(--mono);min-width:30px}
.tb:hover{background:#f2f5f4;color:var(--ink);border-color:var(--line-soft)}
.tb b{font-weight:800}
.tb svg{display:block;width:15px;height:15px}
.tb-sep{width:1px;background:var(--line-soft);margin:4px 3px}
.tb-select{border:1px solid var(--line-soft);background:#fff;border-radius:4px;padding:3px 6px;
  font-family:var(--mono);font-size:12.5px;color:var(--ink);cursor:pointer}
.tb-select:hover{background:#f2f5f4}
/* toolbar dropdown that shows an icon per option (a native <select> cannot) */
.tb-pick{position:relative;display:inline-flex}
.tb-pick svg{display:block;width:15px;height:15px;flex:none}
.tb-pick .ico{display:flex;color:var(--muted)}
.tb-pick-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-soft);background:#fff;
  border-radius:4px;padding:3px 5px 3px 7px;font-family:var(--mono);font-size:12.5px;color:var(--ink);cursor:pointer}
.tb-pick-btn:hover{background:#f2f5f4}
.tb-pick-btn:hover .ico,.tb-pick-opt:hover .ico{color:var(--ink)}
.tb-pick-btn .lbl{min-width:50px;text-align:left}
.tb-pick-btn .caret{font-size:9px;color:var(--muted);line-height:1}
.tb-pick-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:20;min-width:136px;padding:4px;
  background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 26px rgba(0,0,0,.14)}
.tb-pick-menu[hidden]{display:none}
.tb-pick-opt{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:4px;background:none;
  padding:5px 8px;font-family:var(--mono);font-size:12.5px;color:var(--ink);text-align:left;cursor:pointer}
.tb-pick-opt:hover{background:#f2f5f4}
.tb-pick-opt.on{background:var(--accent-soft);color:var(--accent-ink)}
.tb-pick-opt.on .ico{color:var(--accent-ink)}
.tb-color{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:2px;
  border:1px solid transparent;border-radius:4px;padding:3px 7px;cursor:pointer;
  font-family:var(--mono);font-size:12.5px;line-height:1;color:var(--muted)}
.tb-color:hover{background:#f2f5f4;color:var(--ink);border-color:var(--line-soft)}
.tb-color .swatch{width:16px;height:4px;border-radius:1px;border:1px solid var(--line-soft)}
.tb-color input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer}
.tb-color:has(input:disabled){opacity:.35;pointer-events:none}
.editor-shell{padding:0}
.lex-input,.md-input{
  min-height:calc(100% - 40px);padding:22px 26px;outline:none;
  font-size:14.5px;line-height:1.75;caret-color:var(--accent);
}
.md-input{width:100%;border:none;resize:none;font-family:var(--mono);font-size:13px;display:block;min-height:400px}
/* Explicit so the hidden attribute isn't overridden by the display rules above (hides the source textarea in edit mode) */
.lex-input[hidden],.md-input[hidden]{display:none}
.lex-input h1{font-size:22px;margin:.7em 0 .35em;font-weight:700}
.lex-input h2{font-size:18px;margin:.9em 0 .3em;font-weight:700}
.lex-input h3{font-size:15.5px;margin:.9em 0 .3em;font-weight:700}
.lex-input h4{font-size:15px;margin:.9em 0 .3em;font-weight:700}
.lex-input h5{font-size:14px;margin:.9em 0 .3em;font-weight:700}
.lex-input h6{font-size:13px;margin:.9em 0 .3em;font-weight:700;color:var(--muted)}
.lex-input p{margin:.45em 0}
.lex-input ul,.lex-input ol{margin:.45em 0;padding-left:1.5em}
.lex-input li{margin:.15em 0}
.lex-input blockquote{margin:.7em 0;padding:.4em 12px .4em 14px;border-left:3px solid var(--accent);
  border-radius:0 4px 4px 0;background:var(--accent-soft);color:var(--accent-ink);font-style:italic}
.lex-input blockquote p{margin:.2em 0}
.lex-input code{font-family:var(--mono);font-size:12.5px;background:#fbeee9;border:1px solid #efd3c6;
  border-radius:3px;padding:1px 4px;color:#a8442a}
.lex-input pre code{background:none;border:none;padding:0;color:inherit}
.lex-input pre{font-family:var(--mono);font-size:12.5px;background:#f7f9f8;border:1px solid var(--line-soft);
  border-radius:5px;padding:12px 14px;overflow:auto;white-space:pre-wrap}
.lex-input a{color:var(--accent);text-decoration:underline}
.lex-input .b{font-weight:700}
.lex-input .i{font-style:italic}
.lex-input .s{text-decoration:line-through}
.lex-input .u{text-decoration:underline}
.lex-input table{border-collapse:collapse;margin:.7em 0;font-size:13.5px}
.lex-input th,.lex-input td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.lex-input th{background:#f5f8f7;font-weight:650}
.tb.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-soft)}
.tb:disabled{opacity:.35;cursor:not-allowed;background:none}
.tb:disabled:hover{background:none;color:var(--muted);border-color:transparent}
.ph{position:absolute;pointer-events:none;color:#aab4b0;padding:22px 26px;top:40px;left:0}

/* ---------- editor: blocks the toolbar can now insert ---------- */
.lex-input hr{border:0;border-top:1px solid var(--line);margin:1.1em 0}
.lex-input hr.sel{border-top-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.lex-input sub,.lex-input sup{font-size:.72em;line-height:0}
.lex-input mark{background:#fff2a8;color:inherit;border-radius:2px;padding:0 1px}
/* checklist - the marker is drawn on ::before so a click can toggle it */
.lex-input ul.cl{list-style:none;padding-left:1.5em}
.lex-input ul.cl li{position:relative;padding-left:6px}
.lex-input li.li-o::before,.lex-input li.li-x::before{
  content:'';position:absolute;left:-1.25em;top:.36em;width:13px;height:13px;
  border:1.4px solid var(--line);border-radius:3px;background:#fff;cursor:pointer}
.lex-input li.li-x::before{background:var(--accent);border-color:var(--accent)}
.lex-input li.li-x::after{
  content:'';position:absolute;left:-1.09em;top:.55em;width:6px;height:3px;
  border-left:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:rotate(-45deg);pointer-events:none}
.lex-input li.li-x{color:var(--muted);text-decoration:line-through}
/* a table cell picked up by a drag-select */
.lex-input .tbl{table-layout:fixed;width:calc(100% - 2px);overflow:hidden}
.lex-input .tbl-c,.lex-input .tbl-h{position:relative;min-width:64px}
.lex-input .tbl-c.sel-cell,.lex-input .tbl-h.sel-cell{background:var(--accent-soft)}
.lex-input .tbl-c::selection,.lex-input .tbl-h::selection{background:transparent}
/* Prism token colours for a highlighted code block */
.lex-input .tk-c{color:#7d8a86;font-style:italic}
.lex-input .tk-k{color:#0d6b5f;font-weight:600}
.lex-input .tk-s{color:#a8442a}
.lex-input .tk-n{color:#8a5a00}
.lex-input .tk-f{color:#4a4ec2}
.lex-input .tk-o{color:#5f6b67}
.lex-input .tk-p{color:#93a09b}

/* ---------- editor: toolbar extras ---------- */
.lex-toolbar{align-items:center;row-gap:4px}
.tb-grp{display:flex;align-items:center;gap:2px}
.tb-tail{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-count{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.tb-note{font-size:11px;color:var(--muted);white-space:nowrap}
.tb-pick-menu.wide{min-width:184px}
.tb-pick-btn .lbl.w{min-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-pick-opt.kbd::after{content:attr(data-kbd);margin-left:auto;padding-left:14px;
  font-size:10.5px;color:var(--muted)}

/* find / replace bar, docked under the toolbar */
.find-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;
  border-bottom:1px solid var(--line-soft);background:#f7f9f8}
.find-bar[hidden]{display:none}
.find-bar input{border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:13px;
  min-width:130px;flex:1 1 130px;background:#fff}
.find-bar input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.find-bar .hits{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.find-bar .btn{padding:4px 9px;font-size:12.5px}
.find-bar label{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);
  white-space:nowrap;cursor:pointer}
.find-bar label input{min-width:0;flex:none;margin:0}
/* every hit at once, painted with the browser's own highlight registry (no DOM churn) */
::highlight(c9-find){background:#ffe58a;color:var(--ink)}

/* link editor popover */
.link-pop{position:absolute;z-index:30;display:flex;align-items:center;gap:6px;padding:6px;
  background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 10px 26px rgba(0,0,0,.16)}
.link-pop[hidden]{display:none}
.link-pop input{border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:12.5px;
  width:246px;font-family:var(--mono)}
.link-pop input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.link-pop a{font-family:var(--mono);font-size:12.5px;color:var(--accent);max-width:246px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-pop .t-btn{width:26px;height:26px}

/* HTML source view: line numbers in the gutter */
.src-wrap{display:flex;min-height:400px;font-family:var(--mono);font-size:13px;line-height:1.6}
.src-wrap[hidden]{display:none}
.src-gutter{flex:0 0 auto;padding:22px 8px 22px 14px;text-align:right;color:#aab4b0;background:#f7f9f8;
  border-right:1px solid var(--line-soft);user-select:none;white-space:pre;font-variant-numeric:tabular-nums}
.md-input{padding:22px 26px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,30,28,.34);display:grid;place-items:center;z-index:50;padding:18px}
.scrim[hidden]{display:none}
.modal{background:#fff;border:1px solid var(--line);border-radius:10px;width:min(520px,100%);
  box-shadow:0 20px 60px rgba(0,0,0,.22);max-height:90vh;overflow:auto}
.modal h2{margin:0;padding:14px 16px;font-size:14px;border-bottom:1px solid var(--line-soft)}
.modal .m-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.modal .m-foot{padding:12px 16px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:5px;padding:8px 10px;background:#fff;width:100%
}
.field textarea{resize:vertical;min-height:74px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.field label.check{display:flex;gap:8px;align-items:flex-start;text-transform:none;letter-spacing:0;
  font-family:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;margin-top:2px}
.field label.check input{width:auto;margin:1px 0 0;flex:none}
.field label.check em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.5}
.hint b{color:var(--ink);font-weight:600}
.ask-preview{display:flex;gap:10px;align-items:center;background:#f7f9f8;border:1px solid var(--line-soft);
  border-radius:6px;padding:8px}
.ask-preview img{width:74px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.ask-preview span{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* ---------- toast / busy ---------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);opacity:0;
  background:#182220;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:80;
  transition:opacity .18s,transform .18s;pointer-events:none;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}

.busy{position:absolute;inset:0;background:rgba(255,255,255,.82);display:grid;place-items:center;gap:12px;
  align-content:center;justify-items:center;z-index:5}
.busy[hidden]{display:none}
.spin{width:26px;height:26px;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.busy span{font-family:var(--mono);font-size:12px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

@media (max-width:760px){
  .body{flex-direction:column;gap:8px}
  .side{width:100%}
  .splitter{display:none}
  .tree-panel{max-height:34vh}
}
</style>
</head>
<body>
<div class="app">

  <header class="panel topbar">
    <div class="brand">Callout9</div>
    <button id="btnHelp" class="help" title="What Callout9 does"
            aria-label="Open the Callout9 guide">?</button>
  </header>

  <div class="body">
    <aside class="side">
      <div class="panel gen">
        <button id="btnNew" class="btn wide" title="Clear everything and start over">New</button>
        <button id="btnOpen" class="btn wide"
                title="Open a Markdown / AsciiDoc file and split it into tree nodes">Open</button>
        <button id="btnBuild" class="btn primary wide">Build File</button>
        <button id="btnPreview" class="btn wide">Preview</button>
      </div>

      <div class="panel tree-panel">

<script type="module">
/* ══════════════════════════════════════════════════════════
   0. Storage (falls back: Claude artifact -> browser -> memory)
   ══════════════════════════════════════════════════════════ */
const mem = {};
const store = {
  async get(k){
    if (window.storage) { try { const r = await window.storage.get(k, false); return r ? r.value : null; } catch(e){ return null; } }
    try { return localStorage.getItem(k); } catch(e){ return k in mem ? mem[k] : null; }
  },
  async set(k,v){
    if (window.storage) { try { await window.storage.set(k, v, false); return true; } catch(e){ return false; } }
    try { localStorage.setItem(k, v); return true; } catch(e){ mem[k] = v; return false; }
  }
};
const K_PROJECT = 'manualgen:project';
const K_CONFIG  = 'manualgen:config';
const K_MEMOS   = 'manualgen:memos';

/* ══════════════════════════════════════════════════════════
   1. State
   ══════════════════════════════════════════════════════════ */
const DEFAULT_SYSTEM =
`You are a technical writer producing software user manuals.
Using the supplied screenshot and the author's note, write the manual body in English Markdown.
- Use only elements actually visible in the screenshot; never invent features you cannot confirm.
- Use numbered lists for procedures, and a table or bullet points to describe input fields.
- The output is inserted into the document verbatim, so emit only the body text with no greeting or filler such as "Sure, here you go".
- Do not wrap the whole answer in a code fence.`;

const state = {
  title: 'Manual',           // Document title (first MD line · file name)
  nodes: [],          // { id, type:'image'|'text', name, image?, mime?, markdown?, children:[] }
  imageSeq: 0,
  textSeq: 0,
  selectedId: null,
  dirty: false
};
/* `apiKey` is the one field that may stay out of storage. With saveKey off it lives only in
   this object, so closing the page takes it with it — the safer default. */
let config = { provider:'gemini', model:'gemini-3.6-flash', imageModel:'', apiKey:'', baseUrl:'',
               saveKey:false, system: DEFAULT_SYSTEM };

/* What actually gets written to storage: everything except the key, unless asked. */
function persistableConfig(c){
  const out = Object.assign({}, c);
  if (!c.saveKey) out.apiKey = '';
  return out;
}

/* The AI features stay disabled until an API is registered - every provider needs a key. */
const AI_NOT_REGISTERED =
  'AI API is not registered. Register one first under “Register AI API” at the bottom left.';
const aiReady = () => !!config.apiKey;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ══════════════════════════════════════════════════════════
   2. DOM references
   ══════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const treeEl = $('#tree'), edBody = $('#edBody'), edTitle = $('#edTitle'),
      edKind = $('#edKind'), edActions = $('#edActions'), toastEl = $('#toast');

function toast(msg, isErr){
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toastEl.className = 'toast' + (isErr ? ' err' : ''); }, isErr ? 5200 : 2400);
}
document.querySelectorAll('[data-close]').forEach(b =>
  b.addEventListener('click', () => { $('#' + b.dataset.close).hidden = true; }));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.scrim').forEach(s => s.hidden = true);
});

/* The guide opens in its own window, the same way Preview does */
$('#btnHelp').addEventListener('click', () => {
  const w = window.open('Callout9_help.html', 'callout9Help', 'width=1060,height=900');
  if (!w){ toast('The popup was blocked. Please allow popups for this page.', true); return; }
  w.focus();
});

/* ══════════════════════════════════════════════════════════
   3. Tree (rendering, collapsing, keyboard, rename, DnD and delete live in tree-view.js)
   ══════════════════════════════════════════════════════════ */
const tree = createTreeView(treeEl, {
  state,
  countEl: $('#treeCount'),
  tools: { del: $('#btnDelNode'), rename: $('#btnRenameNode'),
           merge: $('#btnMergeNode'), fold: $('#btnFoldAll') },
  toast,
  onSelect: selectNode,
  onRenamed: node => { edTitle.textContent = node.name; },
  onRemoved: () => renderEditor(),
  onChange: () => { pushTreeUndo(); save(); }
});

/* ── Undo for the tree itself ───────────────────────
   Lexical's history only covers the body of one node; adding, deleting, renaming,
   dragging, splitting and merging nodes had no way back at all. Each of those ends in
   onChange(), so the state as it stood just before is what goes on the stack.
   The node objects are copied one level deep - a data URL is an immutable string, so the
   copies share it and a snapshot costs almost nothing however large the images are. */
const TREE_UNDO_MAX = 40;
const cloneNodes = list => (list || []).map(n =>
  Object.assign({}, n, { children: cloneNodes(n.children) }));
const treeSnapshot = () => ({
  nodes: cloneNodes(state.nodes), selectedId: state.selectedId,
  imageSeq: state.imageSeq, textSeq: state.textSeq
});
let treeAt = treeSnapshot();          // the committed state the next change moves away from
const treeUndo = [], treeRedo = [];
let restoringTree = false;

function resetTreeUndo(){
  treeUndo.length = treeRedo.length = 0;
  treeAt = treeSnapshot();
  paintTreeUndo();
}
function paintTreeUndo(){
  $('#btnTreeUndo').disabled = !treeUndo.length;
  $('#btnTreeRedo').disabled = !treeRedo.length;
}
function pushTreeUndo(){
  if (restoringTree) return;          // the restore itself is not a new change
  treeUndo.push(treeAt);
  if (treeUndo.length > TREE_UNDO_MAX) treeUndo.shift();
  treeRedo.length = 0;
  treeAt = treeSnapshot();
  paintTreeUndo();
}
function applyTreeSnapshot(snap){
  restoringTree = true;
  try {
    state.nodes = snap.nodes;
    state.imageSeq = snap.imageSeq;
    state.textSeq = snap.textSeq;
    /* the node the editor was showing may be gone, or be a fresh copy of itself */
    state.selectedId = tree.findNode(snap.selectedId) ? snap.selectedId : null;
    state.dirty = false;
    treeAt = treeSnapshot();
    tree.render();
    renderEditor();
    save();
  } finally { restoringTree = false; }
  paintTreeUndo();
}
function undoTree(){
  if (!treeUndo.length){ toast('There is no tree change to undo.', true); return; }
  treeRedo.push(treeAt);
  applyTreeSnapshot(treeUndo.pop());
  toast('Undid the last tree change.');
}
function redoTree(){
  if (!treeRedo.length){ toast('There is no tree change to redo.', true); return; }
  treeUndo.push(treeAt);
  applyTreeSnapshot(treeRedo.pop());
  toast('Redid the tree change.');
}
$('#btnTreeUndo').addEventListener('click', undoTree);
$('#btnTreeRedo').addEventListener('click', redoTree);
/* Only while the tree has the focus, so it never steals Ctrl+Z from the body editor */
treeEl.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z') return;
  e.preventDefault(); e.stopPropagation();
  (e.shiftKey ? redoTree : undoTree)();
});

function addTextNode(){
  const node = {
    id: uid(), type:'text', name:'Text' + (++state.textSeq),
    markdown:'', html:'', children: []
  };
  const parent = tree.findNode(state.selectedId);
  if (parent){ (parent.children ||= []).push(node); parent.collapsed = false; }
  else state.nodes.push(node);
  selectNode(node.id);
  save();
  tree.startRename(node.id);
}
$('#btnAddNode').addEventListener('click', addTextNode);

/* ══════════════════════════════════════════════════════════
   4. Image paste / add
   ══════════════════════════════════════════════════════════ */
function fileToDataURL(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error('Could not read the image.'));
    r.readAsDataURL(file);
  });
}
/* Adds under the selected node, or at the top level when nothing is selected.
   When several images are added at once the caller pins the parent (parentId) so the
   first one being selected does not turn the following siblings into its children. */
async function addImage(file, parentId = state.selectedId){
  const dataUrl = await fileToDataURL(file);
  const node = {
    id: uid(), type:'image', name:'Image' + (++state.imageSeq),
    image: dataUrl, mime: (file.type || 'image/png'), children: []
  };
  const parent = tree.findNode(parentId);
  if (parent){ (parent.children ||= []).push(node); parent.collapsed = false; }
  else state.nodes.push(node);
  selectNode(node.id); save();
  toast(parent ? `Added node ${node.name} under ${parent.name}.`
               : `Added node ${node.name}.`);
}

document.addEventListener('paste', async e => {
  const items = [...(e.clipboardData?.items || [])].filter(i => i.type.startsWith('image/'));
  if (!items.length) return;              // let text pastes fall through to the editor
  e.preventDefault();
  const parentId = state.selectedId;      // images pasted together all become siblings
  for (const it of items){
    const f = it.getAsFile();
    if (f) { try { await addImage(f, parentId); } catch(err){ toast(err.message, true); } }
  }
});

$('#btnAddImg').addEventListener('click', () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  const parentId = state.selectedId;      // picking several files also makes them siblings
  inp.onchange = async () => { for (const f of inp.files) { try { await addImage(f, parentId); } catch(err){ toast(err.message, true); } } };
  inp.click();
});

/* ══════════════════════════════════════════════════════════
   5. HTML <-> Markdown conversion (edit as HTML, store as MD)
   ══════════════════════════════════════════════════════════ */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* Inline styles that survive the markdown round trip, carried on a <span>. Markdown has no
   syntax for any of them, so they are written out as HTML and read back by mdInline(). */
const STYLE_PROPS = ['color', 'background-color', 'font-family', 'font-size'];
/* Raw inline HTML mdText() may emit; mdInline() lets exactly these back through un-escaped. */
const KEEP_TAGS = ['u', 'sub', 'sup', 'mark'];

/* Markdown metacharacters in body text. Without this a literal "2*3*4" comes back from the
   next mdToHtml() as emphasis, and a line that happens to start with "# " becomes a heading.
   Only the characters that really can change the reading are escaped, so the markdown the
   user downloads still reads like prose. */
function mdEscape(s, atLineStart){
  const out = s.replace(/([\\`*_\[\]<~])/g, '\\$1');
  return atLineStart
    ? out.replace(/^([ \t]*)(#{1,6}(?=\s)|>|[-+](?=\s)|\|)/, '$1\\$2')
         .replace(/^([ \t]*)(\d{1,9})([.)])(?=\s)/, '$1$2\\$3')
    : out;
}

/* One inline pass over a string that is already HTML-escaped. Emphasis is matched with a
   delimiter run rather than a "no star inside" class, so **bold with *italic* inside** and
   snake_case both come out right. */
function mdEmphasis(s){
  let out = '', i = 0;
  while (i < s.length){
    const c = s[i];
    if (c === '\\' && i + 1 < s.length){ out += c + s[i + 1]; i += 2; continue; }
    if (c === '*' || c === '_' || c === '~'){
      let n = 1;
      while (s[i + n] === c) n++;
      const run = c.repeat(n);
      /* "_" only delimits at a word boundary, so file_name_here stays intact */
      const wordInner = c === '_' && /\w/.test(s[i - 1] || '') && /\w/.test(s[i + n] || '');
      const close = wordInner ? -1 : s.indexOf(run, i + n);
      if (close > i + n && !/^\s/.test(s.slice(i + n, close))){
        const inner = mdEmphasis(s.slice(i + n, close));
        const wrap = c === '~' ? (n >= 2 ? ['<del>', '</del>'] : null)
                   : n >= 3   ? ['<strong><em>', '</em></strong>']
                   : n === 2  ? ['<strong>', '</strong>']
                              : ['<em>', '</em>'];
        if (wrap){ out += wrap[0] + inner + wrap[1]; i = close + n; continue; }
      }
      out += run; i += n; continue;
    }
    out += c; i++;
  }
  return out;
}
/* Balanced-bracket scan, so [see [1] here](url) and (a(b)c) style targets both survive */
function matchBracket(s, start, open, close){
  let depth = 0;
  for (let i = start; i < s.length; i++){
    if (s[i] === '\\'){ i++; continue; }
    if (s[i] === open) depth++;
    else if (s[i] === close && !--depth) return i;
  }
  return -1;
}
function mdLinks(s){
  let out = '', i = 0;
  while (i < s.length){
    const bang = s[i] === '!' && s[i + 1] === '[';
    if (s[i] === '[' || bang){
      const lb = bang ? i + 1 : i;
      const rb = matchBracket(s, lb, '[', ']');
      if (rb > 0 && s[rb + 1] === '('){
        const rp = matchBracket(s, rb + 1, '(', ')');
        if (rp > 0){
          const text = s.slice(lb + 1, rb);
          /* an optional "title" after the target is dropped, the target itself is kept whole */
          const dest = s.slice(rb + 2, rp).replace(/\s+&quot;[\s\S]*&quot;\s*$/, '').trim();
          out += bang ? '<img alt="' + text.replace(/"/g, '&quot;') + '" src="' + dest + '">'
                      : '<a href="' + dest + '">' + mdEmphasis(text) + '</a>';
          i = rp + 1; continue;
        }
      }
    }
    if (s[i] === '\\' && i + 1 < s.length){ out += s[i] + s[i + 1]; i += 2; continue; }
    out += s[i]; i++;
  }
  return out;
}
const KEEP_RE = new RegExp('&lt;(' + KEEP_TAGS.join('|') + ')&gt;([\\s\\S]*?)&lt;\\/\\1&gt;', 'g');

/* Parks a code span while the rest of the line is marked up. A NUL cannot occur in the
   text itself, and it is built at runtime so no escape survives into the stored HTML. */
const CODE_MARK = String.fromCharCode(0);
const CODE_SLOT = new RegExp(CODE_MARK + '(\\d+)' + CODE_MARK, 'g');
function mdInline(s){
  const spans = [];
  /* A code span wins over every other marker, so they leave the string first and come
     back last - "**not `*bold*` here**" must not read the stars inside the span. */
  let t = esc(s)
    .replace(/(?<!\\)(`+)([\s\S]*?)(?<!\\)\1/g,
             (_, f, c) => CODE_MARK + spans.push(c.replace(/^ | $/g, '')) + CODE_MARK)
    /* the styled spans and the raw tags mdText() emits come back through - nothing else does */
    .replace(/&lt;span style=("[^"&<>]*")&gt;([\s\S]*?)&lt;\/span&gt;/g, '<span style=$1>$2</span>')
    .replace(KEEP_RE, '<$1>$2</$1>');
  t = mdEmphasis(mdLinks(t))
    .replace(/&lt;(https?:[^\s&<>]+)&gt;/g, '<a href="$1">$1</a>')     // autolink
    .replace(/\\([\\`*_\[\]<~#>+\-.)|])/g, '$1');                      // drop the backslashes
  return t.replace(CODE_SLOT, (_, n) => '<code>' + spans[n - 1] + '</code>');
}

function mdToHtml(md){
  const lines = (md || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;
  const isTableRow = l => /^\s*\|.*\|\s*$/.test(l);
  /* a "\|" inside a cell is content, not a divider */
  const cells = l => l.trim().replace(/^\||\|$/g, '')
                      .split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));

  while (i < lines.length){
    const line = lines[i];

    const fence = /^\s*(`{3,}|~{3,})\s*([A-Za-z0-9_+#-]*)/.exec(line);
    if (fence){                                                  // code block, language kept
      const close = new RegExp('^\\s*' + fence[1][0] + '{' + fence[1].length + ',}\\s*$');
      const buf = []; i++;
      while (i < lines.length && !close.test(lines[i])) buf.push(lines[i++]);
      i++;
      const cls = fence[2] ? ' class="language-' + fence[2].toLowerCase() + '"' : '';
      out.push('<pre><code' + cls + '>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }
    if (!line.trim()){ i++; continue; }
    if (/^\s*((-\s*){3,}|(\*\s*){3,}|(_\s*){3,})$/.test(line)){ out.push('<hr>'); i++; continue; }

    const h = /^(#{1,6})\s+(.*?)\s*#*$/.exec(line);
    if (h){ out.push(`<h${h[1].length}>${mdInline(h[2].trim())}</h${h[1].length}>`); i++; continue; }

    if (isTableRow(line) && isTableRow(lines[i+1] || '') && /^[\s|:-]+$/.test(lines[i+1])){
      const head = cells(line);
      const align = cells(lines[i+1]).map(c =>                   // :--- / :---: / ---:
        /^:.*:$/.test(c) ? 'center' : /:$/.test(c) ? 'right' : /^:/.test(c) ? 'left' : '');
      i += 2;
      const rows = [];
      while (i < lines.length && isTableRow(lines[i])) rows.push(cells(lines[i++]));
      const at = k => align[k] ? ' style="text-align: ' + align[k] + '"' : '';
      out.push('<table><thead><tr>' + head.map((c,k) => `<th${at(k)}>${mdInline(c)}</th>`).join('') +
        '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map((c,k) => `<td${at(k)}>${mdInline(c)}</td>`).join('') + '</tr>').join('') +
        '</tbody></table>');
      continue;
    }

    if (/^\s*>\s?/.test(line)){                                  // blockquote
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      /* Keep a single-paragraph quote as bare inline content, matching what Lexical
         emits - otherwise every save/reload round trip re-wraps it in a <p>. */
      const inner = mdToHtml(buf.join('\n'));
      const lone = /^<p>([\s\S]*)<\/p>$/.exec(inner);
      out.push(`<blockquote>${lone && !lone[1].includes('<p>') ? lone[1] : inner}</blockquote>`);
      continue;
    }

    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)){                     // list (nesting supported)
      const buf = [];
      while (i < lines.length && (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) || /^\s{2,}\S/.test(lines[i]))) buf.push(lines[i++]);
      out.push(listToHtml(buf, 0));
      continue;
    }

    const para = [];                                             // paragraph
    while (i < lines.length && lines[i].trim() &&
           !/^\s*(#{1,6}\s|>|`{3,}|~{3,}|[-*+]\s|\d+[.)]\s)/.test(lines[i]) && !isTableRow(lines[i]))
      para.push(lines[i++]);
    out.push('<p>' + para.map(l => mdInline(l.trim())).join('<br>') + '</p>');
  }
  return out.join('\n');
}
const TASK = /^\[([ xX])\]\s+/;
function listToHtml(lines, depth){
  const pat = new RegExp(`^\\s{${depth * 2},${depth * 2 + 1}}?([-*+]|\\d+[.)])\\s+(.*)$`);
  const items = [];
  let ordered = false, start = null;
  for (let i = 0; i < lines.length; i++){
    const m = pat.exec(lines[i]);
    if (m){
      ordered = /\d/.test(m[1]);
      if (ordered && start === null) start = parseInt(m[1], 10);   // "3." keeps numbering from 3
      items.push({ text: m[2], sub: [] });
    } else if (items.length){
      items[items.length - 1].sub.push(lines[i].replace(/^\s{2}/, ''));
    }
  }
  if (!items.length) return '<p>' + mdInline(lines.join(' ').trim()) + '</p>';
  /* "- [ ] text" is a checklist. Mixing checked items with plain bullets in one list is not
     representable, so the whole list follows whatever its first item is. */
  const task = !ordered && TASK.test(items[0].text);
  const tag = ordered ? 'ol' : 'ul';
  const attr = ordered && start !== null && start !== 1 ? ' start="' + start + '"'
             : task ? ' class="checklist"' : '';
  return '<' + tag + attr + '>' + items.map(it => {
    const t = TASK.exec(it.text);
    const li = task && t
      ? '<li role="checkbox" aria-checked="' + /[xX]/.test(t[1]) + '">' + mdInline(it.text.slice(t[0].length))
      : '<li>' + mdInline(it.text);
    return li + (it.sub.length ? listToHtml(it.sub, 0) : '') + '</li>';
  }).join('') + '</' + tag + '>';
}

function htmlToMd(html){
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  return mdBlocks(doc.body).replace(/\n{3,}/g, '\n\n').trim();
}
const INLINE_MARK = { strong:'**', b:'**', em:'*', i:'*', del:'~~', s:'~~', strike:'~~' };
/* Lexical exports a bold run as <b><strong>…</strong></b> and an italic one as <i><em>…</em></i>
   (createDOM already picks the semantic tag, then exportDOM wraps it again). Emitting the
   marker for both levels produced "****text****", which no markdown reader renders. */
function sameMark(el, mark){
  const only = el.childNodes.length === 1 ? el.firstChild : null;
  return !!only && only.nodeType === 1 && INLINE_MARK[only.tagName.toLowerCase()] === mark;
}
/* opt.inCode: inside <pre>, where nothing is escaped and every space is content.
   opt.raw:    inside an <a> label or a table cell, where a real line break cannot be written. */
function mdText(el, opt){
  const o = opt || {};
  let out = '';
  el.childNodes.forEach(c => {
    if (c.nodeType === 3){
      if (o.inCode){ out += c.nodeValue; return; }
      /* a run of spaces is content the author typed; only the newlines that pretty-printed
         HTML introduces are folded away */
      out += mdEscape(c.nodeValue.replace(/[\t\n\r]+/g, ' '), !out.trim());
      return;
    }
    if (c.nodeType !== 1) return;
    const t = c.tagName.toLowerCase();
    /* inside a code block a break is just a newline - a markdown hard break would leave
       two stray spaces at the end of every line of code */
    if (t === 'br'){ out += o.inCode ? '\n' : o.raw ? '<br>' : '  \n'; return; }
    if (t === 'code' && !o.inCode){
      const body = c.textContent;                       // a backtick inside needs a longer fence
      const run = (body.match(/`+/g) || []).reduce((n, s) => Math.max(n, s.length), 0);
      const f = '`'.repeat(run + 1);
      out += f + (body.startsWith('`') ? ' ' : '') + body + (body.endsWith('`') ? ' ' : '') + f;
      return;
    }
    if (t === 'img'){
      out += '![' + (c.getAttribute('alt') || '').replace(/[\[\]]/g, '') + '](' +
             (c.getAttribute('src') || '') + ')';
      return;
    }

    let inner = mdText(c, o);
    if (t === 'a'){
      const label = mdText(c, Object.assign({}, o, { raw:true })).trim();
      out += label ? '[' + label + '](' + (c.getAttribute('href') || '') + ')' : '';
      return;
    }

    /* Colours, fonts and sizes can sit on any inline tag, not just <span> — a coloured bold
       run carries them on the <strong>. Markdown has no syntax for them, so keep an HTML span. */
    const css = inlineStyle(c);
    if (css && inner.trim()) inner = '<span style="' + css + '">' + inner + '</span>';

    /* Markdown cannot underline, sub/superscript or highlight either, so those tags are
       carried over as they stand */
    if (KEEP_TAGS.includes(t)){ out += inner.trim() ? '<' + t + '>' + inner + '</' + t + '>' : inner; return; }

    const mark = INLINE_MARK[t];
    if (mark){
      /* the surrounding spaces have to sit outside the markers, or the run does not render */
      const lead = /^\s*/.exec(inner)[0], tail = /\s*$/.exec(inner)[0];
      const body = inner.trim();
      out += !body ? inner : sameMark(c, mark) ? lead + body + tail : lead + mark + body + mark + tail;
      return;
    }
    out += inner;
  });
  return out;
}
const BLOCK_CHILD = /^(p|div|section|article|figure|ul|ol|li|blockquote|pre|hr|table|h[1-6])$/i;
const hasBlockChild = el => [...el.children].some(x => BLOCK_CHILD.test(x.tagName));
/* The language a <pre><code class="language-js"> carries, so ```js survives the round trip */
function codeLang(pre){
  /* Lexical stamps the language on the <pre> itself; a block that came in from markdown
     carries it as a class on the inner <code>. */
  const attr = pre.getAttribute('data-highlight-language') || pre.getAttribute('data-language');
  if (attr) return attr;
  const el = pre.querySelector('code') || pre;
  const m = /(?:^|\s)(?:language|lang)-([\w+#-]+)/.exec(el.className || '');
  return m ? m[1] : '';
}
function mdBlocks(el){
  const parts = [];
  el.childNodes.forEach(c => {
    if (c.nodeType === 3){ const t = c.nodeValue.trim(); if (t) parts.push(mdEscape(t, true)); return; }
    if (c.nodeType !== 1) return;
    const tag = c.tagName.toLowerCase();
    if (/^h[1-6]$/.test(tag)) parts.push('#'.repeat(+tag[1]) + ' ' + mdText(c).trim());
    else if (tag === 'p'){ const s = mdText(c).trim(); if (s) parts.push(s); }
    else if (tag === 'ul' || tag === 'ol') parts.push(mdList(c, 0));
    else if (tag === 'blockquote'){
      /* Lexical keeps a quote's text inline (<blockquote>text <b>bold</b></blockquote>), so
         mdBlocks() used to turn every inline run inside it into its own quote block.
         Only recurse when the quote really does hold block-level children. */
      const body = hasBlockChild(c) ? mdBlocks(c) : mdText(c).trim();
      parts.push(body.split('\n').map(l => l ? '> ' + l : '>').join('\n'));
    }
    else if (tag === 'pre'){
      const body = mdText(c, { inCode:true }).replace(/\n$/, '');
      /* the fence has to be longer than the longest backtick run inside the block */
      const run = (body.match(/^`{3,}/gm) || []).reduce((n, s) => Math.max(n, s.length), 2);
      const f = '`'.repeat(run + 1);
      parts.push(f + codeLang(c) + '\n' + body + '\n' + f);
    }
    else if (tag === 'hr') parts.push('---');
    else if (tag === 'table') parts.push(mdTable(c));
    else if (tag === 'br'){ /* ignore */ }
    else if (['div','section','article','main','figure'].includes(tag)) parts.push(mdBlocks(c));
    else { const s = mdText(c).trim(); if (s) parts.push(s); }
  });
  return parts.filter(Boolean).join('\n\n');
}
const isChecked = li => li.getAttribute('aria-checked') === 'true' ||
                        /(^|\s)li-x(\s|$)/.test(li.className || '');
function mdList(list, depth){
  const ordered = list.tagName.toLowerCase() === 'ol';
  const check = !ordered && (/(^|\s)(cl|checklist)(\s|$)/.test(list.className || '') ||
                             [...list.children].some(li => li.hasAttribute('aria-checked')));
  const pad = '  '.repeat(depth);
  const lines = [];
  let i = parseInt(list.getAttribute('start') || '1', 10) || 1;   // "start" keeps the numbering
  [...list.children].forEach(li => {
    if (li.tagName.toLowerCase() !== 'li') return;
    const nested = [...li.children].filter(x => /^(ul|ol)$/i.test(x.tagName));
    const clone = li.cloneNode(true);
    [...clone.children].forEach(x => { if (/^(ul|ol)$/i.test(x.tagName)) x.remove(); });
    const box = check ? (isChecked(li) ? '[x] ' : '[ ] ') : '';
    lines.push(pad + (ordered ? `${i++}. ` : '- ') + box + mdText(clone).trim());
    nested.forEach(n => lines.push(mdList(n, depth + 1)));
  });
  return lines.join('\n');
}
const ALIGN_MARK = { left:':---', center:':---:', right:'---:' };
function mdTable(t){
  const rows = [...t.querySelectorAll('tr')];
  if (!rows.length) return '';
  /* a cell body has to stay on one line, so any break inside is carried as <br> */
  const cells = r => [...r.children].map(td =>
    mdText(td, { raw:true }).trim().replace(/\|/g, '\\|') || ' ');
  const head = cells(rows[0]);
  const align = [...rows[0].children].map(td =>
    (td.style && td.style.textAlign) || td.getAttribute('align') || '');
  const lines = ['| ' + head.join(' | ') + ' |',
                 '|' + head.map((_, k) => ' ' + (ALIGN_MARK[align[k]] || '---') + ' ').join('|') + '|'];
  rows.slice(1).forEach(r => lines.push('| ' + cells(r).join(' | ') + ' |'));
  return lines.join('\n');
}

/* ══════════════════════════════════════════════════════════
   6. Editor
   ══════════════════════════════════════════════════════════ */
let currentEditor = null;   // { save(), destroy() }

function selectNode(id){
  if (state.selectedId === id) return;
  flushEditor();
  state.selectedId = id;
  tree.expandAncestors(id);
  tree.render();
  renderEditor();
}
function flushEditor(){                    // keep edits from being lost when switching nodes
  if (currentEditor && state.dirty){ currentEditor.save(true); }
}

function renderEditor(){
  if (currentEditor?.destroy) currentEditor.destroy();
  currentEditor = null; state.dirty = false;
  edActions.innerHTML = ''; edBody.innerHTML = '';

  const node = tree.findNode(state.selectedId);
  if (!node){
    edTitle.textContent = 'Editor'; edKind.hidden = true;
    edBody.innerHTML = `<div class="blank">
      <div class="big">Paste an image to get started</div>
      <div>Press <kbd>Ctrl</kbd> + <kbd>V</kbd> to paste a screenshot and a node is added to the tree on the left.</div>
      <img src="workflow.svg" alt="The four-step Callout9 workflow: paste a screen, the AI writes the body, the tree becomes the outline, and it all builds into one Markdown file."></div>`;
    return;
  }
  edTitle.textContent = node.name;
  edKind.hidden = false;
  edKind.textContent = node.type === 'image' ? 'image' : 'text';

  if (node.type === 'image') renderImageView(node);
  else renderTextView(node);
}

function renderImageView(node){
  const wrap = document.createElement('div');
  wrap.className = 'imgwrap';
  edBody.appendChild(wrap);

  const busy = document.createElement('div');
  busy.className = 'busy'; busy.hidden = true;
  busy.innerHTML = '<div class="spin"></div><span>AI is writing the content…</span>';
  wrap.appendChild(busy);

  /* If the editor is unavailable (script failed to load), fall back to view-only */
  if (typeof window.createImageEditor !== 'function'){
    const img = document.createElement('img');
    img.src = node.image; img.alt = node.name;
    img.style.cssText = 'max-width:100%;margin:auto;border:1px solid var(--line);border-radius:5px;background:#fff';
    busy.before(img);
    const fab = document.createElement('button');
    fab.className = 'btn primary'; fab.textContent = '✦ Generate with AI';
    fab.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:24px';
    fab.addEventListener('click', () => openAsk(node));
    wrap.appendChild(fab);
    currentEditor = {
      node, save(){}, busy, fab,
      setAIEnabled(on){
        fab.classList.toggle('off', !on);
        fab.setAttribute('aria-disabled', on ? 'false' : 'true');
        fab.title = on ? '' : 'An AI API must be registered first';
      }
    };
    currentEditor.setAIEnabled(aiReady());
    return;
  }

  /* Saving is driven by the editor toolbar icon (💾 · Ctrl+S); this only shows status */
  const flag = document.createElement('span');
  flag.className = 'dirty'; flag.textContent = '';
  edActions.append(flag);

  const markDirty = () => { state.dirty = true; flag.textContent = '● Unsaved'; };

  const ed = createImageEditor(wrap, {
    src: node.image,
    aiEnabled: aiReady(),
    onChange: markDirty,
    onAI: () => openAsk(node),
    onSave: () => currentEditor.save()
  });
  wrap.appendChild(busy);              // re-append so it stays above the editor

  currentEditor = {
    node, busy, fab: ed.aiButton,
    setAIEnabled: ed.setAIEnabled,
    save(silent){
      const changed = ed.isDirty();
      if (changed){
        node.image = ed.toDataURL('image/png');
        node.mime  = 'image/png';
        ed.markSaved();
      }
      state.dirty = false; flag.textContent = '';
      if (changed){ save(); tree.render(); }
      if (!silent) toast(changed ? `Saved to ${node.name}.` : 'Nothing has changed.');
    },
    destroy(){ ed.destroy(); }
  };
}

/* The picture a text node describes: the nearest image among the siblings before it,
   and failing that the parent when the parent is an image node. */
function imageFor(id){
  let hit = null;
  const walk = (list, parent) => {
    const i = list.findIndex(n => n.id === id);
    if (i >= 0){
      for (let k = i - 1; k >= 0; k--) if (list[k].type === 'image'){ hit = list[k]; return true; }
      if (parent && parent.type === 'image') hit = parent;
      return true;                      // found the node; stop whether or not an image turned up
    }
    for (const n of list) if (n.children?.length && walk(n.children, n)) return true;
    return false;
  };
  walk(state.nodes, null);
  return hit;
}
const NO_IMAGE_TO_LABEL =
  'There is no image to label. Put this text node after an image node, or under one.';

/* ── Splitting a text node ──────────────────────────
   The editor hands over everything below the caret's line; it is stored in a new sibling
   right below this node, named after the first line of that tail that carries text. */
const SPLIT_TITLE_MAX = 30;
const BLOCK_TAGS = 'p,div,li,h1,h2,h3,h4,h5,h6,blockquote,pre,tr,td,th,section,article,figcaption';
function splitTitle(html){
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  /* textContent runs the blocks together, so every line break becomes a real newline first */
  doc.body.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
  doc.body.querySelectorAll(BLOCK_TAGS).forEach(el => el.append('\n'));
  for (const line of (doc.body.textContent || '').split('\n')){
    const t = line.replace(/\s+/g, ' ').trim();
    if (t) return t.slice(0, SPLIT_TITLE_MAX).trimEnd();
  }
  return '';
}
function addSplitSibling(after, html){
  const node = {
    id: uid(), type:'text',
    name: splitTitle(html) || ('Text' + (++state.textSeq)),
    html, markdown: htmlToMd(html), children: []
  };
  tree.insertAfter(after.id, node);          // redraws the tree and autosaves
  return node;
}

/* ── Merging a text node into another ───────────────
   The reverse of the split above: the selected text node is folded into the nearest text
   node before it, and disappears from the tree. */
const NO_MERGE_TARGET =
  'There is no text node to merge into. A text node among the siblings above this one, or an ancestor text node, is needed.';

/* Where a node sits: the list holding it, its index in that list, its ancestors from the
   top down, and its 1-based depth (a top-level node is 1). */
function locate(id){
  let hit = null;
  const walk = (list, chain) => {
    for (let i = 0; i < list.length; i++){
      const n = list[i];
      if (n.id === id){ hit = { node:n, list, index:i, chain, depth: chain.length + 1 }; return true; }
      if (n.children?.length && walk(n.children, chain.concat(n))) return true;
    }
    return false;
  };
  walk(state.nodes, []);
  return hit;
}
/* The text node a merge folds the selection into: the nearest one among the siblings
   above it, and failing that the nearest text node up the parent chain. */
function mergeTargetFor(loc){
  for (let i = loc.index - 1; i >= 0; i--) if (loc.list[i].type === 'text') return loc.list[i];
  for (let i = loc.chain.length - 1; i >= 0; i--) if (loc.chain[i].type === 'text') return loc.chain[i];
  return null;
}
const nodeHtml = n => n.html || mdToHtml(n.markdown || '');

function mergeSelectedIntoText(){
  const loc = locate(state.selectedId);
  if (!loc){ toast('Select the text node to merge first.', true); return; }
  const src = loc.node;
  if (src.type !== 'text'){ toast('Only a text node can be merged.', true); return; }
  const target = mergeTargetFor(loc);
  if (!target){ toast(NO_MERGE_TARGET, true); return; }

  const kids = src.children?.length
    ? `\nIts ${src.children.length} child node(s) move under “${target.name}”.` : '';
  if (!confirm(`Merge “${src.name}” into “${target.name}”?\n` +
               `Its name is appended as a heading, then its body, and the node itself is removed.${kids}`)) return;

  flushEditor();                            // whatever is on screen unsaved counts as the body
  /* The node's own name leads the appended body, as a heading at its tree depth
     (depth 3 -> <h3>), exactly as buildMarkdown() would have emitted it. */
  const level = Math.min(Math.max(loc.depth, 1), 6);
  const name = (src.name || '').trim();
  const merged = [nodeHtml(target),
                  name ? `<h${level}>${esc(name)}</h${level}>` : '',
                  nodeHtml(src)]
                 .filter(s => s && s.trim()).join('\n');
  target.html = merged;
  target.markdown = htmlToMd(merged);
  if (src.children?.length){                // children stay in the tree, under the target
    (target.children ||= []).push(...src.children);
    target.collapsed = false;
  }
  loc.list.splice(loc.index, 1);            // the target is never inside src, so this index holds

  state.selectedId = target.id;
  tree.expandAncestors(target.id);
  tree.render();
  renderEditor();
  save();
  toast(`Merged “${src.name}” into ${target.name}.`);
}
$('#btnMergeNode').addEventListener('click', mergeSelectedIntoText);

/* How long the typing has to stop before the body is written back to the node */
const AUTOSAVE_MS = 2500;

function renderTextView(node){
  const btnSave = document.createElement('button');
  btnSave.className = 'btn primary sm'; btnSave.textContent = 'Save';
  const flag = document.createElement('span');
  flag.className = 'dirty'; flag.textContent = '';

  /* Labels the image this text belongs to, using the numbers written here */
  const target = imageFor(node.id);
  const btnAI = document.createElement('button');
  btnAI.className = 'btn sm'; btnAI.textContent = '✦ Generate with AI';
  const setAI = on => {
    const ok = on && !!target;
    btnAI.classList.toggle('off', !ok);
    btnAI.setAttribute('aria-disabled', ok ? 'false' : 'true');
    btnAI.title = !target ? NO_IMAGE_TO_LABEL
                : ok     ? `Label ${target.name} with the numbers in this text`
                         : 'An AI API must be registered first';
  };
  btnAI.addEventListener('click', () => {
    if (!target){ toast(NO_IMAGE_TO_LABEL, true); return; }
    if (!aiReady()){ toast(AI_NOT_REGISTERED, true); openApi(); return; }
    if (state.dirty) currentEditor.save(true);   // send the text as it stands on screen
    openLabelAsk(target, node.markdown || '');
  });
  edActions.append(flag, btnAI, btnSave);

  const shell = document.createElement('div');
  shell.className = 'editor-shell';
  edBody.appendChild(shell);

  /* Shown while the AI draws; runAsk() drives it through currentEditor.busy */
  const busy = document.createElement('div');
  busy.className = 'busy'; busy.hidden = true;
  busy.innerHTML = '<div class="spin"></div><span>AI is drawing the image…</span>';
  edBody.appendChild(busy);

  const markDirty = () => {
    state.dirty = true;
    flag.className = 'dirty'; flag.textContent = '● Unsaved';
  };
  const clearDirty = () => { state.dirty = false; flag.className = 'dirty'; flag.textContent = ''; };

  if (!LEX_OK){
    btnSave.disabled = true;
    shell.innerHTML =
      '<div class="blank"><div class="big">Could not load the editor</div>' +
      '<div>vendor/lexical.bundle.js failed to load. Check that the file exists, then refresh.</div></div>';
    currentEditor = {
      node, busy, fab: btnAI, setAIEnabled: setAI,
      save(){ toast('Cannot save because the editor failed to load.', true); }
    };
    setAI(aiReady());
    return;
  }

  /* Autosave: the body is written back to the node a few seconds after the typing stops,
     so a crash or a closed tab no longer costs the whole edit. The Save button stays -
     it is what confirms the write and clears the "unsaved" flag out loud. */
  let autoT = null;
  const cancelAuto = () => { clearTimeout(autoT); autoT = null; };
  const scheduleAuto = () => {
    cancelAuto();
    autoT = setTimeout(() => {
      if (state.dirty && currentEditor && currentEditor.node === node) currentEditor.save(true, true);
    }, AUTOSAVE_MS);
  };

  const ed = mountLexical(shell, node, () => { markDirty(); scheduleAuto(); }, tail => {
    currentEditor.save(true);                       // the caret's line and all above it stay here
    const made = addSplitSibling(node, tail);
    toast(`Split off “${made.name}”.`);
  });
  currentEditor = {
    node, busy, fab: btnAI, setAIEnabled: setAI,
    save(silent, auto){
      cancelAuto();
      node.html = ed.getHtml();          // editing state
      node.markdown = ed.getMarkdown();  // for export
      clearDirty(); save();
      if (auto){ flag.className = 'dirty saved'; flag.textContent = '✓ Autosaved'; }
      else if (!silent) toast(`Saved to ${node.name}.`);
    },
    destroy(){ cancelAuto(); ed.destroy?.(); }
  };
  setAI(aiReady());
  btnSave.addEventListener('click', () => currentEditor.save());
  shell.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 's'){

let LEX = null, LEX_OK = false;
/* Picks up the namespaces vendor/lexical.bundle.js exposes as window.LexicalBundle.
   No network request is made, so this also works offline and behind a corporate network. */
function loadLexical(){
  const B = window.LexicalBundle;
  const NS = ['core','rich','list','code','link','html','table','hist','util','sel'];
  const missing = B ? NS.filter(k => !B[k]) : NS;
  if (!B || missing.length){
    console.warn('Lexical bundle failed to load; text editing is unavailable.',
      B ? 'Missing namespaces: ' + missing.join(', ')
        : 'vendor/lexical.bundle.js could not be loaded (missing file or wrong path).');

}

/* ── Extra nodes the bundle does not ship ──────────
   A horizontal rule is a leaf block with no children, so it is a DecoratorNode whose
   decoration is the <hr> itself. Without it every "---" in an opened markdown file was
   silently dropped on the way into the editor. */
let HorizontalRuleNode = null, $createHorizontalRuleNode = null, $isHorizontalRuleNode = null;
function defineExtraNodes({ core }){
  if (HorizontalRuleNode) return;
  class HR extends core.DecoratorNode {
    static getType(){ return 'horizontalrule'; }
    static clone(n){ return new HR(n.__key); }
    static importJSON(){ return $createHorizontalRuleNode(); }
    static importDOM(){
      return { hr: () => ({ conversion: () => ({ node: $createHorizontalRuleNode() }), priority: 0 }) };
    }
    exportJSON(){ return { type:'horizontalrule', version:1 }; }
    exportDOM(){ return { element: document.createElement('hr') }; }
    createDOM(){ return document.createElement('hr'); }
    updateDOM(){ return false; }
    getTextContent(){ return '\n'; }
    isInline(){ return false; }
    decorate(){ return null; }

  $createHorizontalRuleNode = () => core.$applyNodeReplacement(new HR());

/* Shared builder for the top toolbar. An item is either a ready-made element or
   [label, fn, title, opts]; a null fn draws a separator. */
function buildToolbar(bar, items){
  for (const item of items){
    if (item instanceof HTMLElement){ bar.appendChild(item); continue; }
    const [label, fn, title, opts] = item;
    if (!fn){ const s = document.createElement('div'); s.className = 'tb-sep'; bar.appendChild(s); continue; }
    const b = document.createElement('button');
    b.className = 'tb'; b.type = 'button'; b.innerHTML = label;

    if (opts && opts.label) b.setAttribute('aria-label', opts.label);
    else if (title) b.setAttribute('aria-label', title.replace(/\s*\([^)]*\)\s*$/, ''));

/* One tab stop for the whole toolbar, arrows to move inside it - the pattern screen
   readers and keyboard users expect from a toolbar, instead of 25 tab stops. */
function rovingToolbar(bar){
  bar.setAttribute('role', 'toolbar');
  const stops = () => [...bar.querySelectorAll('button,select,input,.tb-pick-btn')]
    .filter(el => !el.disabled && el.offsetParent !== null);
  const paint = active => stops().forEach(el => { el.tabIndex = el === active ? 0 : -1; });
  const first = () => { const s = stops(); if (s.length) paint(s[0]); };
  first();
  bar.addEventListener('focusin', e => { if (stops().includes(e.target)) paint(e.target); });
  bar.addEventListener('keydown', e => {
    const dir = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1
              : e.key === 'Home' ? 'first' : e.key === 'End' ? 'last' : 0;
    if (!dir) return;
    const s = stops();
    if (!s.length) return;
    const i = s.indexOf(document.activeElement);
    const next = dir === 'first' ? s[0] : dir === 'last' ? s[s.length - 1]
               : s[(Math.max(i, 0) + dir + s.length) % s.length];
    e.preventDefault(); paint(next); next.focus();
  });
  return { refresh: first };
}

/* Toolbar dropdown that shows an icon beside each option - a native <select> renders
   only plain text in its <option>s. items: [{ value, label, icon }] */
function iconSelect(title, items, onPick, opt){
  const o = opt || {};
  const wrap = document.createElement('div');
  wrap.className = 'tb-pick'; wrap.title = title;
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'tb-pick-btn';
  btn.setAttribute('aria-haspopup', 'listbox');
  btn.setAttribute('aria-label', title);
  btn.innerHTML = '<span class="ico"></span><span class="lbl' + (o.wide ? ' w' : '') + '"></span>' +
                  '<span class="caret">▾</span>';
  const menu = document.createElement('div');
  menu.className = 'tb-pick-menu' + (o.wide ? ' wide' : '');
  menu.hidden = true; menu.setAttribute('role', 'listbox');
  wrap.append(btn, menu);

  let value = items[0].value;
  const opts = items.map(it => {
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'tb-pick-opt' + (it.kbd ? ' kbd' : '');
    el.setAttribute('role', 'option'); el.tabIndex = -1;
    if (it.kbd) el.dataset.kbd = it.kbd;
    if (it.style) el.style.cssText = it.style;
    el.innerHTML = '<span class="ico">' + (it.icon || '') + '</span>' +
                   '<span class="lbl">' + it.label + '</span>';
    el.addEventListener('click', () => { open(false); btn.focus(); set(it.value); onPick(it.value); });
    menu.appendChild(el);
    return el;
  });
  function set(v){
    const it = items.find(i => i.value === v) || items[0];
    value = it.value;
    btn.querySelector('.ico').innerHTML = it.icon || '';
    btn.querySelector('.lbl').textContent = it.label;
    opts.forEach((el, i) => {
      const on = items[i].value === value;
      el.classList.toggle('on', on);
      el.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }
  /* Close on an outside click or Escape. The listeners only live while the menu is
     open, so a destroyed editor leaves nothing behind on document. */
  function onDocDown(e){ if (!wrap.contains(e.target)) open(false); }
  function onDocKey(e){
    if (e.key === 'Escape'){ e.stopPropagation(); open(false); btn.focus(); return; }
    if (!menu.contains(document.activeElement) && document.activeElement !== btn) return;
    const dir = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
    if (!dir && e.key !== 'Home' && e.key !== 'End') return;
    e.preventDefault(); e.stopPropagation();
    const i = opts.indexOf(document.activeElement);
    const next = e.key === 'Home' ? opts[0] : e.key === 'End' ? opts[opts.length - 1]
               : opts[(Math.max(i, 0) + dir + opts.length) % opts.length];
    next.focus();
  }
  function open(on){
    menu.hidden = !on;
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
    const bind = on ? 'addEventListener' : 'removeEventListener';
    document[bind]('mousedown', onDocDown, true);
    document[bind]('keydown', onDocKey, true);
    if (on) (opts.find(el => el.classList.contains('on')) || opts[0]).focus();
  }
  btn.addEventListener('click', () => open(menu.hidden));
  btn.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(true); }
  });
  /* keep the caret where it is, exactly like the plain toolbar buttons */
  wrap.addEventListener('mousedown', e => { if (e.target !== btn || menu.hidden) e.preventDefault(); });
  open(false); set(value);
  return { el: wrap, set, get: () => value, close: () => open(false) };
}

/* "color"/"background-color"/"font-*" helpers shared by the editor and the MD converters */
function styleMap(css){
  const out = {};
  for (const part of (css || '').split(';')){
    const i = part.indexOf(':');
    if (i < 0) continue;
    const k = part.slice(0, i).trim().toLowerCase(), v = part.slice(i + 1).trim();
    if (k && v) out[k] = v;
  }
  return out;
}
/* Double quotes would end the style="…" attribute mdText() writes it into, and a font
   stack is the one value that usually carries them. */
const styleText = m => Object.entries(m)
  .map(([k, v]) => k + ': ' + String(v).replace(/"/g, "'")).join('; ');
/* Only the properties that survive a markdown round trip, in a stable order */
function inlineStyle(el){
  const m = {};
  for (const p of STYLE_PROPS){ const v = el.style && el.style.getPropertyValue(p); if (v) m[p] = v.trim(); }
  return styleText(m);

/* input[type=color] only accepts #rrggbb, but the stored value may be rgb()/#rgb */
function toHex(v){
  const t = String(v || '').trim();
  let m = /^#([0-9a-f]{3})$/i.exec(t);
  if (m) return '#' + [...m[1]].map(c => c + c).join('').toLowerCase();
  m = /^#([0-9a-f]{6})$/i.exec(t);
  if (m) return '#' + m[1].toLowerCase();
  m = /^rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)/i.exec(t);
  if (m) return '#' + m.slice(1, 4)
    .map(x => Math.max(0, Math.min(255, Math.round(+x))).toString(16).padStart(2, '0')).join('');
  return null;
}

function mountLexical(shell, node, markDirty, onSplit){

  const bar = document.createElement('div'); bar.className = 'lex-toolbar';

  input.setAttribute('aria-label','Body editor');

  /* HTML source view: a gutter of line numbers beside the textarea */
  const srcWrap = document.createElement('div');
  srcWrap.className = 'src-wrap'; srcWrap.hidden = true;
  const gutter = document.createElement('div'); gutter.className = 'src-gutter'; gutter.setAttribute('aria-hidden','true');

  function convertStyledSpan(el){
    const st = el.style;
    const dec = (st.textDecoration || '').split(' ');
    const marks = [
      ['bold', st.fontWeight === 'bold' || +st.fontWeight >= 600],
      ['italic', st.fontStyle === 'italic'],
      ['strikethrough', dec.includes('line-through')],
      ['underline', dec.includes('underline')]

    const styles = styleMap(inlineStyle(el));
    return {
      node: null,
      forChild: child => {
        if (!core.$isTextNode(child)) return child;
        for (const [fmt, on] of marks) if (on && !child.hasFormat(fmt)) child.toggleFormat(fmt);
        const own = styleMap(child.getStyle());
        /* a nested span already set the property; the inner one wins */
        for (const [k, v] of Object.entries(styles)) if (!(k in own)) own[k] = v;
        child.setStyle(styleText(own));

    namespace: 'callout9',
    theme: LEX_THEME,
    onError: e => console.error(e),
    html: { import: { span: () => ({ conversion: convertStyledSpan, priority: 1 }) } },
    nodes: [rich.HeadingNode, rich.QuoteNode, list.ListNode, list.ListItemNode,
